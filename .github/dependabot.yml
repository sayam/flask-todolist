# Dependabot version updates — **เปิดเฉพาะของที่ถูกตรึงไว้ ไม่ใช่ทุกอย่าง**
#
# กติกาข้อเดียวที่อธิบายไฟล์นี้ทั้งไฟล์: **ตรึงอะไรไว้ ต้องมีคนขยับให้ตัวนั้น**
# pin โดยไม่มีใครขยับคือการแช่ช่องโหว่ไว้ตลอดกาล ซึ่งแย่กว่าไม่ pin เลย
# (`tests/test_dockerfile_pinning.py` + `tests/test_ci_pinning.py` บังคับข้อนี้)
#
# ทำไม `Pipfile.lock` ของแอปไม่อยู่ที่นี่: version update ของมันจะเปิด PR ทุกครั้ง
# ที่ dependency ตัวใดตัวหนึ่งในร้อยกว่าตัวออกรุ่นใหม่ = PR แทบทุกวันในโปรเจกต์ที่มี
# คนดูแลคนเดียว · **security update ของ pip เปิดอยู่แล้ว** (ตั้งในหน้า repo ไม่ใช่
# ในไฟล์นี้) ซึ่งตอบคำถามที่เร่งด่วนจริงคือ "มี CVE ไหม" · และมันไม่ได้ถูก *ตรึง*
# ไว้ที่รุ่นใดรุ่นหนึ่ง — `Pipfile` ยังเป็น `"*"` การขยับจึงเกิดตอนใครรัน `pipenv lock`
#
# **ข้อสมมติข้างบนเป็นจริงเฉพาะตอนที่ยังมีคนแตะ PR ของ Dependabot อยู่**
# (audit รอบ 26 ข้อ 3) — GitHub ระบุว่า repo ที่ไม่มีใครแตะ PR ของ Dependabot
# ครบ **90 วัน** ถือว่าไม่ active แล้ว Dependabot จะหยุดสร้าง PR ทั้ง version
# **และ security** update · ตาข่ายที่ย่อหน้าข้างบนอ้างถึง จึงถูกเก็บไปพร้อมกับ
# สิ่งที่มันรับ ด้วยเงื่อนไขเดียวกัน ไม่ใช่คนละเงื่อนไข
#
# ตัวที่กันข้อนี้ไม่ใช่ไฟล์นี้ แต่เป็น **แถวรักษาชีพ** ใน `docs/SECURITY-CADENCE.md`
# (รอบ 45 วัน — ADR 0074) ซึ่งสั่งให้แตะ PR ของ Dependabot อย่างน้อยหนึ่งใบ ·
# แถวเดียวกันนั้นยังกันไม่ให้ `on: schedule` ของ workflow ถูกปิดที่ 60 วันด้วย —
# นาฬิกาสองตัวของ GitHub รีเซ็ตพร้อมกันด้วยการกลับมาครั้งเดียว
#
# ทำไมเปิดกับ actions: action ที่ค้างรุ่นเป็นความเสี่ยง supply chain โดยตรง —
# มันรันด้วยสิทธิ์ของ workflow เรา และ **จำนวน PR น้อยมาก** เพราะมีสิบกว่าตัว
# ที่ pin ไว้ที่ major เท่านั้น (ไม่ใช่ทุกรุ่นย่อย)
#
# **`commit-message.prefix` ต้องเป็นชนิดที่ `scripts/lint_commits.py` รับ**
# ไม่งั้น PR ของ Dependabot จะแดงที่ job `commit-lint` ทุกใบตั้งแต่ใบแรก
# แล้วคนดูแลจะเรียนรู้ที่จะเมินมัน — `tests/test_dependabot.py` บังคับข้อนี้ไว้
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    # รวมทุกตัวไว้ใน PR เดียวต่อสัปดาห์ — action มักขยับพร้อมกันเป็นชุด
    # และ PR ห้าใบที่แก้เรื่องเดียวกันคือห้าใบที่ไม่มีใครอ่านสักใบ
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  # **นี่คือสิ่งที่ทำให้การ pin digest ของ base image ไม่ทำให้แย่ลง**
  # `FROM python:3.13-slim@sha256:...` ปิดทางที่ tag จะถูกย้ายทับเงียบ ๆ แต่ก็
  # ปิดทางที่ security patch จะมาเองด้วย — ตัวนี้เปิด PR ขยับ digest ให้แทน
  # patch จึงยังมาเหมือนเดิม **แค่มาเป็น PR ที่มีคนเห็นและผ่าน check ทุกด่าน**
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    open-pull-requests-limit: 3
    # **ขอแค่ digest ใหม่ ไม่ใช่ Python รุ่นใหม่**
    # PR ใบแรกที่มันเปิดให้คือ `3.13-slim` → `3.14-slim` ซึ่งไม่ใช่สิ่งที่การ pin
    # digest ต้องการเลย · รุ่นของ Python ถูกตรึงไว้ที่ 3.13 อีก 14 จุดในโปรเจกต์
    # (`Pipfile`, `pyproject.toml` ×2, `ci.yml` ×11) การขยับที่ Dockerfile
    # ที่เดียวจึงเป็นการทำให้ image ไม่ตรงกับทุกที่ที่เหลือ ไม่ใช่การอัปเดต
    #
    # **การขึ้นรุ่น Python เป็นการตัดสินใจที่ต้องขยับพร้อมกันทั้งโปรเจกต์**
    # ไม่ใช่ของที่ควรมาถึงในรูปของ PR อัตโนมัติที่แก้ไฟล์เดียว
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # **image ของ stack ที่ CI ยิงจริง — คนละ ecosystem กับ `docker` ข้างบน**
  # (audit รอบ 15) Dependabot แยก `docker` (อ่าน `Dockerfile`) ออกจาก
  # `docker-compose` (อ่านไฟล์ compose) · เราประกาศไว้แค่ตัวแรกมาตลอด ผลคือ image
  # 11 ตัวที่ 11 job ดึงมารันทุก push ไม่เคยถูกตรึงเลย — ตรงข้ามกับ action, base
  # image และเครื่องมือของ CI ที่มีด่านบังคับการ pin คนละตัว
  #
  # **ตรึงแล้วต้องมีคนขยับ — บรรทัดนี้คือคนคนนั้น** ถ้าประกาศไว้แล้วยังไม่มี PR
  # ทั้งที่มี digest ใหม่ แปลว่าชื่อไฟล์ของเราไม่เข้าเกณฑ์ที่มันอ่าน ซึ่งเป็น
  # ข้อเท็จจริงที่ต้องวัด ไม่ใช่เดา — แถวตรวจอยู่ใน `docs/SECURITY-CADENCE.md`
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    groups:
      stack-images:
        patterns:
          - "*"
    open-pull-requests-limit: 3
    # **ขอแค่ digest ใหม่ ไม่ใช่ยี่ห้อรุ่นใหม่** — เหตุผลเดียวกับ `python` ข้างบน
    # ทุกตัวอักษร · PR ใบแรกที่ ecosystem นี้เปิดให้ (#132) เสนอขยับ 9 image พร้อมกัน
    # โดยมี **mysql 8 → 26 · redis 7 → 8 · vault 1.18 → 2.0 · grafana 12 → 13**
    # ปนอยู่ — ซึ่งไม่ใช่สิ่งที่การตรึง digest ต้องการเลย
    #
    # เลขรุ่นของยี่ห้อในไฟล์ compose เป็น **คำตัดสินว่าเรารองรับอะไร** (`mysql:8`
    # กับ `mariadb:11` คือสิ่งที่ job `dialects` ทดสอบทุก push · `keycloak:26`
    # คือ IdP ที่ `compose.sso.yaml` ผูกคอนฟิกไว้) การขึ้นรุ่นจึงเป็นการตัดสินใจ
    # ที่ต้องขยับเอกสาร เทสต์ และคอนฟิกพร้อมกัน ไม่ใช่ของที่ควรมาถึงในรูป PR
    # อัตโนมัติที่แก้เลขในไฟล์เดียว
    #
    # **security patch ยังมาเหมือนเดิม** เพราะ upstream ออก image ใหม่ทับ tag เดิม
    # แล้ว Dependabot ขยับ digest ให้ — ซึ่งคือสิ่งเดียวที่เราต้องการจากตัวนี้
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # **เครื่องมือที่ CI ติดตั้งเอง ถูกตรึงด้วย hash ใน `pins/`** (ดู pins/README.md)
  # เหตุผลเดียวกับสองอันบน: `pip install pipenv` เปล่า ๆ หยิบรุ่นล่าสุดเสมอ ตรึง
  # แล้วต้องมีคนขยับ · ไฟล์พวกนี้เป็นผลของ `pip-compile --generate-hashes` ซึ่ง
  # Dependabot รู้จัก (มันอ่านหัวไฟล์แล้ว compile ใหม่ให้ ไม่ใช่แก้ hash ทีละบรรทัด)
  # — `requirements.in` จึงต้องถูก commit ไปด้วย ไม่งั้นมันขยับให้ไม่ได้
  - package-ecosystem: "pip"
    directories:
      - "/pins/pip"
      - "/pins/pipenv"
      - "/pins/semgrep"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      ci-tools:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  # pa11y-ci ของ job `a11y` — ตรึงทั้งต้นไม้ (162 package) ไว้ใน package-lock.json
  - package-ecosystem: "npm"
    directory: "/pins/pa11y"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      pa11y:
        patterns:
          - "*"
    open-pull-requests-limit: 3
