# Dependabot version updates — **เปิดไว้เฉพาะ GitHub Actions โดยตั้งใจ**
#
# ทำไมไม่เปิดกับ pip ด้วย: version update ของ pip จะเปิด PR ทุกครั้งที่ dependency
# ตัวใดตัวหนึ่งออกรุ่นใหม่ ซึ่งกับ lock ที่มีร้อยกว่า package แปลว่า PR แทบทุกวัน
# ในโปรเจกต์ที่มีคนดูแลคนเดียว · **security update ของ pip เปิดอยู่แล้ว**
# (ตั้งในหน้า repo ไม่ใช่ในไฟล์นี้) ซึ่งตอบคำถามที่เร่งด่วนจริงคือ "มี CVE ไหม"
#
# ทำไมเปิดกับ actions: action ที่ค้างรุ่นเป็นความเสี่ยง supply chain โดยตรง —
# มันรันด้วยสิทธิ์ของ workflow เรา และ **จำนวน PR น้อยมาก** เพราะมีสิบกว่าตัว
# ที่ pin ไว้ที่ major เท่านั้น (ไม่ใช่ทุกรุ่นย่อย)
#
# **`commit-message.prefix` ต้องเป็นชนิดที่ `scripts/lint_commits.py` รับ**
# ไม่งั้น PR ของ Dependabot จะแดงที่ job `commit-lint` ทุกใบตั้งแต่ใบแรก
# แล้วคนดูแลจะเรียนรู้ที่จะเมินมัน — `tests/test_dependabot.py` บังคับข้อนี้ไว้
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    # รวมทุกตัวไว้ใน PR เดียวต่อสัปดาห์ — action มักขยับพร้อมกันเป็นชุด
    # และ PR ห้าใบที่แก้เรื่องเดียวกันคือห้าใบที่ไม่มีใครอ่านสักใบ
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  # **นี่คือสิ่งที่ทำให้การ pin digest ของ base image ไม่ทำให้แย่ลง**
  # `FROM python:3.13-slim@sha256:...` ปิดทางที่ tag จะถูกย้ายทับเงียบ ๆ แต่ก็
  # ปิดทางที่ security patch จะมาเองด้วย — ตัวนี้เปิด PR ขยับ digest ให้แทน
  # patch จึงยังมาเหมือนเดิม **แค่มาเป็น PR ที่มีคนเห็นและผ่าน 23 check**
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    open-pull-requests-limit: 3
    # **ขอแค่ digest ใหม่ ไม่ใช่ Python รุ่นใหม่**
    # PR ใบแรกที่มันเปิดให้คือ `3.13-slim` → `3.14-slim` ซึ่งไม่ใช่สิ่งที่การ pin
    # digest ต้องการเลย · รุ่นของ Python ถูกตรึงไว้ที่ 3.13 อีก 14 จุดในโปรเจกต์
    # (`Pipfile`, `pyproject.toml` ×2, `ci.yml` ×11) การขยับที่ Dockerfile
    # ที่เดียวจึงเป็นการทำให้ image ไม่ตรงกับทุกที่ที่เหลือ ไม่ใช่การอัปเดต
    #
    # **การขึ้นรุ่น Python เป็นการตัดสินใจที่ต้องขยับพร้อมกันทั้งโปรเจกต์**
    # ไม่ใช่ของที่ควรมาถึงในรูปของ PR อัตโนมัติที่แก้ไฟล์เดียว
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
