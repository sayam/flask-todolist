# OpenSSF Scorecard — ให้คะแนนแนวปฏิบัติของ repo เทียบเกณฑ์ภายนอก
#
# **แยกไฟล์จาก `ci.yml` เพราะมันต้องการ trigger ที่ ci.yml ไม่มี**:
# `branch_protection_rule` (วัดใหม่ทันทีที่กฎของ branch เปลี่ยน) กับ `schedule`
# — ถ้ายัดลง ci.yml การตั้ง cron จะลากทั้ง 21 job ไปรันทุกสัปดาห์โดยไม่ได้อะไรเพิ่ม
#
# **ไม่ได้อยู่ในรายการ required status check ของ branch protection โดยตั้งใจ**
# มันไม่รันบน pull request (ดู trigger ข้างล่าง) การบังคับจึงเท่ากับ PR ทุกใบ
# รอ check ที่ไม่มีวันมา · และโดยธรรมชาติมันเป็น *คะแนน* ไม่ใช่ผ่าน/ไม่ผ่าน —
# ด่านที่ไม่มีเส้นแบ่งชัดไม่ควรเป็นด่านที่บล็อกคน
#
# action ทุกตัวถูก pin ด้วย commit SHA (ดู `tests/test_workflow_pinning.py`) —
# คอมเมนต์ `# vX.Y.Z` ต่อท้ายคือสิ่งเดียวที่บอกคนอ่านว่ากำลังใช้รุ่นไหน และเป็น
# สิ่งที่ Dependabot อ่านเพื่อรู้ว่าต้องขยับอะไร
#
# หมายเหตุของ action ตัวนี้: **มันไม่มี tag `@v2`** repo ของมันออกแต่ tag เต็มรุ่น
# ตัวอย่างส่วนใหญ่บนเน็ตที่เขียน `@v2` จะพังด้วย "unable to resolve action"
name: scorecard

on:
  # กดรันเองได้ — ด่านที่ต้องรอเหตุการณ์ถึงจะพิสูจน์ได้ คือด่านที่ทดสอบยากกว่าที่ควร
  # (เพิ่มตอนตั้ง `POSTURE_TOKEN` ครั้งแรก: ต้องยืนยันว่าสิทธิ์พอโดยไม่ต้องรอ
  # PR ใบถัดไป merge — และตอน token หมดอายุก็ใช้เส้นนี้ยืนยันใบใหม่เหมือนกัน)
  workflow_dispatch:
  branch_protection_rule:
  schedule:
    # ทุกวันจันทร์ — เลขนาทีสุ่มไว้ ไม่ให้ไปกองกับ cron ของคนอื่นที่ต้นชั่วโมง
    - cron: "27 5 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  scorecard:
    runs-on: ubuntu-latest
    permissions:
      # อัปโหลดผลเข้าหน้า code scanning (ที่เดียวกับ CodeQL)
      security-events: write
      # ให้ Scorecard ยืนยันตัวตนกับ OpenSSF API ตอนเผยแพร่ผล
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scorecard ตรวจข้อนี้เอง และเป็นแนวปฏิบัติที่ถูกอยู่แล้ว —
          # ไม่มีเหตุผลให้ token ค้างอยู่ใน .git/config ของ runner
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # **เผยแพร่ผลไปที่ OpenSSF API** — เป็นเงื่อนไขของการมี badge
          # ข้อมูลที่ส่งเป็นข้อเท็จจริงเกี่ยวกับ repo สาธารณะซึ่งเปิดอยู่แล้ว
          publish_results: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      # ผลไปโผล่ที่หน้า Security ร่วมกับ CodeQL — ที่เดียวกับที่คนไปดูอยู่แล้ว
      # ดีกว่ามีหน้าใหม่อีกหน้าที่ไม่มีใครเปิด
      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: results.sarif

  # ท่าทีฝั่งแพลตฟอร์ม — ADR 0061 · audit รอบ 7 ข้อ 2
  #
  # **อยู่ในไฟล์นี้เพราะ trigger ตรงกันพอดี**: `branch_protection_rule` ยิงทันที
  # ที่กฎของ branch เปลี่ยน ซึ่งคือวินาทีที่เราอยากรู้ว่ามันยังตรงกับ ADR 0053 ไหม
  # · รันบน push main ด้วย เพราะความล้มเหลวของงานตามรอบที่ไม่มีใครเห็นคือความ
  # ล้มเหลวที่เงียบ · **ไม่อยู่ใน required check** เพราะไม่รันบน pull request
  # (หลักเดียวกับ scorecard — และตัวมันเองเป็นคนตรวจว่ารายการนั้นครบ)
  posture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # อ่าน alert ของ code scanning ได้ด้วย GITHUB_TOKEN ของ job เอง (ADR 0061
      # โน้ต 2026-08-18 · audit รอบ 10 ข้อ 3) — **ไม่ต้องขยาย scope ของ PAT**
      # สิทธิ์ที่ยืมได้ต่อ run ถูกกว่าสิทธิ์ถาวรที่ผูกกับบัญชีคนเสมอ
      security-events: read
      # อ่านประวัติ run ของ workflow (audit รอบ 10 ข้อ 2) — **บล็อก `permissions:`
      # ของ job ทับค่าระดับ workflow ทั้งก้อน** `read-all` ข้างบนจึงไม่ตกมาถึงที่นี่
      actions: read
      # **ไม่มี `administration` ในรายการ scope ของ GITHUB_TOKEN** — เคยประกาศไว้
      # ที่นี่แล้วทำให้ทั้งไฟล์ไม่ start ("workflow file issue") ตั้งแต่วันที่เพิ่ม
      # job นี้ จนกว่าจะจับได้ในอีกวัน · สิทธิ์อ่าน branch protection ให้ผ่าน
      # `POSTURE_TOKEN` ซึ่งเป็น fine-grained PAT (Administration: read) เท่านั้น
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r pins/pipenv/requirements.txt
      - run: pipenv sync --dev
      - name: ท่าทีของ repo ต้องตรงกับที่ ADR 0053 ประกาศ
        run: pipenv run python scripts/audit_posture.py
        env:
          # ไม่มี PAT = สคริปต์อ่าน API ไม่ได้แล้ว **แดง (exit 2) ไม่ใช่ข้าม**
          # ตามที่ ADR 0061 กำหนดไว้ — ด่านที่เงียบตอนอ่านไม่ได้ คือด่านที่รายงาน
          # ว่าท่าทีถูกต้องทั้งที่ไม่เคยอ่านอะไรเลย · วิธีออก token อยู่ใน
          # docs/OPERATIONS.md
          GH_TOKEN: ${{ secrets.POSTURE_TOKEN || secrets.GITHUB_TOKEN }}
          # token คนละใบสำหรับคำถามคนละชั้น — ท่าทีต้องใช้ PAT ส่วน alert ใช้ของ job
          GH_TOKEN_ALERTS: ${{ secrets.GITHUB_TOKEN }}
      - name: ตารางเวลาที่ประกาศไว้ต้องยังยิงอยู่จริง
        run: pipenv run python scripts/schedule_census.py
        env:
          # อ่านประวัติ run ของ workflow — `GITHUB_TOKEN` ของ job พอแล้ว
          # ด้วย `actions: read` ที่ job ขอไว้ข้างบน ไม่ต้องใช้ PAT
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
