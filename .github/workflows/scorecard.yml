# OpenSSF Scorecard — ให้คะแนนแนวปฏิบัติของ repo เทียบเกณฑ์ภายนอก
#
# **แยกไฟล์จาก `ci.yml` เพราะมันต้องการ trigger ที่ ci.yml ไม่มี**:
# `branch_protection_rule` (วัดใหม่ทันทีที่กฎของ branch เปลี่ยน) กับ `schedule`
# — ถ้ายัดลง ci.yml การตั้ง cron จะลากทั้ง 21 job ไปรันทุกสัปดาห์โดยไม่ได้อะไรเพิ่ม
#
# **ไม่ได้อยู่ในรายการ required status check ของ branch protection โดยตั้งใจ**
# มันไม่รันบน pull request (ดู trigger ข้างล่าง) การบังคับจึงเท่ากับ PR ทุกใบ
# รอ check ที่ไม่มีวันมา · และโดยธรรมชาติมันเป็น *คะแนน* ไม่ใช่ผ่าน/ไม่ผ่าน —
# ด่านที่ไม่มีเส้นแบ่งชัดไม่ควรเป็นด่านที่บล็อกคน
#
# action ทุกตัวถูก pin ด้วย commit SHA (ดู `tests/test_workflow_pinning.py`) —
# คอมเมนต์ `# vX.Y.Z` ต่อท้ายคือสิ่งเดียวที่บอกคนอ่านว่ากำลังใช้รุ่นไหน และเป็น
# สิ่งที่ Dependabot อ่านเพื่อรู้ว่าต้องขยับอะไร
#
# หมายเหตุของ action ตัวนี้: **มันไม่มี tag `@v2`** repo ของมันออกแต่ tag เต็มรุ่น
# ตัวอย่างส่วนใหญ่บนเน็ตที่เขียน `@v2` จะพังด้วย "unable to resolve action"
#
# **ไฟล์นี้มี job เดียวโดยตั้งใจ (2026-08-27)** — `posture` เคยอยู่ที่นี่เพราะ
# trigger ตรงกัน แต่เมื่อมันแดง run ของทั้งไฟล์เป็น `failure` แล้ว GitHub ขึ้น
# ป้ายว่า *"Scorecard is reporting errors"* ทั้งที่ Scorecard สำเร็จทุกรอบ ·
# **สถานะ tool ของ code scanning อ่านจากสุขภาพของ run ไม่ใช่จากผลวิเคราะห์**
# การเอางานอื่นมาอยู่ร่วมไฟล์จึงเท่ากับยืมชื่อเครื่องมือภายนอกไปรับความผิด
# · ย้ายไป `.github/workflows/posture.yml` แล้ว
name: scorecard

on:
  # กดรันเองได้ — ด่านที่ต้องรอเหตุการณ์ถึงจะพิสูจน์ได้ คือด่านที่ทดสอบยากกว่าที่ควร
  # (เพิ่มตอนตั้ง `POSTURE_TOKEN` ครั้งแรก: ต้องยืนยันว่าสิทธิ์พอโดยไม่ต้องรอ
  # PR ใบถัดไป merge — และตอน token หมดอายุก็ใช้เส้นนี้ยืนยันใบใหม่เหมือนกัน)
  workflow_dispatch:
  branch_protection_rule:
  schedule:
    # ทุกวันจันทร์ — เลขนาทีสุ่มไว้ ไม่ให้ไปกองกับ cron ของคนอื่นที่ต้นชั่วโมง
    - cron: "27 5 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # อัปโหลดผลเข้าหน้า code scanning (ที่เดียวกับ CodeQL)
      security-events: write
      # ให้ Scorecard ยืนยันตัวตนกับ OpenSSF API ตอนเผยแพร่ผล
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scorecard ตรวจข้อนี้เอง และเป็นแนวปฏิบัติที่ถูกอยู่แล้ว —
          # ไม่มีเหตุผลให้ token ค้างอยู่ใน .git/config ของ runner
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # **เผยแพร่ผลไปที่ OpenSSF API** — เป็นเงื่อนไขของการมี badge
          # ข้อมูลที่ส่งเป็นข้อเท็จจริงเกี่ยวกับ repo สาธารณะซึ่งเปิดอยู่แล้ว
          publish_results: true
          # **ข้อ Branch-Protection อ่านไม่ได้ด้วย `GITHUB_TOKEN`** — วัดจริง
          # 2026-08-22: API ของ Scorecard คืน `-1` พร้อมเหตุผล "some github
          # tokens can't read branch protection" ซึ่งแปลว่าด่านที่ ADR 0053
          # พึ่งพามากที่สุด เป็นข้อเดียวที่คะแนนไม่ได้บอกอะไรเลย · ยืม
          # `POSTURE_TOKEN` (fine-grained · Administration: read) ใบเดียวกับที่
          # job `posture` ใช้ — **สิทธิ์อ่านอย่างเดียว ไม่มีสิทธิ์เขียนโค้ด**
          # · ไม่มี secret (เช่น รันจาก fork) = ตกกลับไปใบเดิม แล้วข้อนั้นกลับ
          # เป็น -1 ตามเดิม ซึ่งเป็นการเสื่อมที่ยอมรับได้ ไม่ใช่ job แดง
          repo_token: ${{ secrets.POSTURE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      # ผลไปโผล่ที่หน้า Security ร่วมกับ CodeQL — ที่เดียวกับที่คนไปดูอยู่แล้ว
      # ดีกว่ามีหน้าใหม่อีกหน้าที่ไม่มีใครเปิด
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
