# Phase 0 quality gates — ทุก push ต้องเขียว (ดู docs/ROADMAP.md)
# คำสั่งทุกตัว mirror จากที่รันผ่านบนเครื่อง dev แล้ว — CI ไม่มีคำสั่งพิเศษของตัวเอง
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # **redis จริงเพื่อให้เทสต์ที่ต้องมี store ที่แชร์ได้ *รันจริงทุก push*** (P5-07)
    # ก่อนหน้านี้เทสต์พวกนั้นข้ามตัวเองเสมอใน CI เพราะไม่มีใครตั้ง `TEST_REDIS_URL`
    # แปลว่า "พิสูจน์แล้ว" หมายถึง "พิสูจน์บนเครื่องคนเขียนครั้งเดียว" ซึ่งไม่ใช่
    # สิ่งเดียวกันเลย — โดยเฉพาะกับข้อที่ปิดหนี้เรื่องโควตาที่นับแยกต่อ process
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pipenv
      - run: pip install pipenv
      - run: pipenv sync --dev
      # ไลบรารีของ plugin อยู่นอก `[packages]` (ADR 0025) ต้องติดตั้งแยก —
      # ถามชื่อ category จากตัวแอปเอง **ห้าม hardcode ชื่อ plugin ใน CI**
      - name: ติดตั้ง category ของ plugin ทุกตัวที่ประกาศไว้
        run: pipenv sync --categories="$(pipenv run flask plugin-deps --categories)"
        env:
          SECRET_KEY: ci-only-secret-key-not-used-in-production-1234
      - name: pytest + coverage gate (fail_under ใน pyproject)
        run: pipenv run pytest -q --cov --cov-report=xml
        env:
          SECRET_KEY: ci-only-secret-key-not-used-in-production-1234
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
      - name: diff-cover (บรรทัดที่แก้ต้องมีเทสต์ 100%)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=50
          pipenv run diff-cover coverage.xml --compare-branch origin/${{ github.base_ref }} --fail-under 100

  dialects:
    # **ยิงชุดเทสต์ทั้งชุดใส่ MySQL กับ MariaDB จริง** (ADR 0026 · P5-04)
    # job `test` รันบน SQLite ซึ่งให้อภัยหลายอย่างที่ยี่ห้ออื่นไม่ให้ — ที่เจอจริง
    # ตอนเปิด job นี้ครั้งแรก: fixture สี่ตัวสร้างตารางเองแล้วไม่เก็บกวาด ซึ่งบน
    # `sqlite:///:memory:` ไม่เคยเป็นปัญหาเพราะฐานตายไปพร้อม engine
    #
    # ใช้ service container ของ GitHub Actions จึงไม่ต้องมี runtime บนเครื่อง dev
    # (ในเครื่องจะยิงเองก็ตั้ง MySQL/MariaDB ที่ไหนก็ได้แล้วส่ง TEST_DATABASE_URL มา)
    name: dialect (${{ matrix.db.name }})
    runs-on: ubuntu-latest
    strategy:
      # **ห้าม fail-fast** — อยากเห็นว่าพังยี่ห้อเดียวหรือทั้งสอง ซึ่งเป็นคนละอาการ
      fail-fast: false
      matrix:
        db:
          # **คำสั่ง health ต่างกันตามยี่ห้อโดยจำเป็น** — `mysqladmin` ไม่มีใน image
          # ของ MariaDB 11 แล้ว (ตัดชื่อเก่าออก เหลือ `mariadb-admin`) ใช้ตัวเดียวกัน
          # ทั้งคู่แล้ว service container จะขึ้น unhealthy ทั้งที่ตัวฐานข้อมูลไม่ได้พัง
          # — เจอจริงตอน push แรกของ job นี้ และเครื่อง dev ไม่เจอเพราะ Debian package
          # ยังมี symlink ชื่อเก่าให้อยู่
          - name: mysql-8
            image: mysql:8
            scheme: mysql+pymysql
            ping: mysqladmin
          - name: mariadb-11
            image: mariadb:11
            scheme: mariadb+pymysql
            ping: mariadb-admin
    services:
      db:
        image: ${{ matrix.db.image }}
        env:
          # image ของ mariadb รับตัวแปรชื่อ MYSQL_* ด้วยเพื่อความเข้ากันได้
          MYSQL_ROOT_PASSWORD: ci-only-not-a-real-password
          MYSQL_DATABASE: todolist_test
        ports:
          - 3306:3306
        # ไม่มี health check = เทสต์เริ่มก่อน server พร้อม แล้วแดงด้วย
        # "Can't connect" ซึ่งอ่านแล้วนึกว่าโค้ดผิด
        options: >-
          --health-cmd="${{ matrix.db.ping }} ping -h 127.0.0.1 -uroot -pci-only-not-a-real-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pipenv
      - run: pip install pipenv
      - run: pipenv sync --dev
      # driver ของยี่ห้อพวกนี้อยู่ใน category ของ plugin ชนิด `db` (ADR 0026)
      # ถามชื่อจากตัวแอปเอง **ห้าม hardcode ชื่อ plugin ใน CI**
      - name: ติดตั้ง category ของ plugin ทุกตัวที่ประกาศไว้
        run: pipenv sync --categories="$(pipenv run flask plugin-deps --categories)"
        env:
          SECRET_KEY: ci-only-secret-key-not-used-in-production-1234
      # ไม่มี coverage gate ที่นี่ — เพดานวัดจาก job `test` ที่เดียว
      # job นี้ตอบคำถามเดียว: พฤติกรรมเหมือนกันทุกยี่ห้อไหม
      - name: pytest ทั้งชุดบน ${{ matrix.db.name }}
        run: pipenv run pytest -q
        env:
          SECRET_KEY: ci-only-secret-key-not-used-in-production-1234
          TEST_DATABASE_URL: >-
            ${{ matrix.db.scheme }}://root:ci-only-not-a-real-password@127.0.0.1:3306/todolist_test

  bare:
    # job `test` แต่ **ไม่มี step ติดตั้ง category ของ plugin** (ADR 0025 ข้อ 7)
    # นี่คือด่านเดียวที่ทำให้ "ถอดส่วนเสริมแล้วไม่พัง" เป็นข้อเท็จจริงที่วัดได้
    # ทุก push แทนที่จะเป็นความตั้งใจที่เขียนไว้ในเอกสาร — และมันคือสภาพของ
    # เครื่องที่ `pipenv sync --dev` เฉย ๆ ได้ ซึ่งคือค่าเริ่มต้นของทุกคนที่ clone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pipenv
      - run: pip install pipenv
      - run: pipenv sync --dev
      # ถ้าวันหนึ่งไลบรารีของ plugin เผลอย้ายกลับเข้า `[packages]` ของ core
      # job นี้จะยังเขียวทั้งที่ไม่ได้พิสูจน์อะไรเลย — ตรวจก่อนว่ามันหายไปจริง
      # ถามสถานะจากตัวแอปเอง **ห้าม hardcode ชื่อ plugin หรือชื่อไลบรารีใน CI**
      - name: ยืนยันว่าไม่มีไลบรารีของ plugin ตัวไหนติดตั้งอยู่
        run: |
          set -o pipefail
          # **เก็บ output ก่อนแล้วค่อยนับ** ไม่ใช่ต่อท่อยาวเส้นเดียว — exit code
          # ของ `x=$(cmd | awk | wc -l)` มาจาก `wc` เสมอ (= 0) คำสั่งที่พังจึง
          # กลายเป็น "ไม่มีไลบรารีติดตั้งอยู่" ซึ่งคือคำว่า *ผ่าน* ของด่านนี้พอดี
          # (ตระกูลเดียวกับ `if ! cmd; then status=$?` ใน scripts/purge_cron.sh)
          deps=$(pipenv run flask plugin-deps)
          categories=$(pipenv run flask plugin-deps --categories)
          # ด่านนี้อ่านคอลัมน์ที่สามด้วย awk รูปแบบบรรทัดจึงเป็นสัญญา ไม่ใช่การจัดหน้า
          # (ตรึงไว้ด้วย `test_plugin_deps_rows_are_a_contract_that_ci_reads`)
          # ถ้ารูปแบบเปลี่ยนไปโดยไม่มีใครแก้ตรงนี้ awk จะนับได้ 0 แล้ว job นี้จะ
          # เขียวโดยไม่ได้ตรวจอะไรเลย — เทียบกับ `--categories` เพื่อจับกรณีนั้น
          readable=$(printf '%s\n' "$deps" | awk -F'\t' '$3 == "ok" || $3 == "MISSING"' | wc -l)
          if [ -n "$categories" ] && [ "$readable" = "0" ]; then
            echo "มีจุด plug ที่ประกาศไลบรารีไว้ ($categories) แต่อ่านสถานะจาก plugin-deps ไม่ได้"
            echo "รูปแบบ output เปลี่ยนไปแล้วหรือเปล่า — ด่านนี้อ่านคอลัมน์ที่สามเป็น ok/MISSING"
            printf '%s\n' "$deps"
            exit 1
          fi
          installed=$(printf '%s\n' "$deps" | awk -F'\t' '$3 == "ok"' | wc -l)
          if [ "$installed" != "0" ]; then
            echo "โหมด bare แต่ยังมีไลบรารีของ plugin ติดตั้งอยู่ $installed รายการ"
            printf '%s\n' "$deps"
            exit 1
          fi
        env:
          SECRET_KEY: ci-only-secret-key-not-used-in-production-1234
      # ไม่มี coverage gate ที่นี่ — โหมดนี้ไม่ได้เดินโค้ดของส่วนเสริมเลย
      # เพดาน coverage วัดจาก job `test` ที่ติดตั้งครบ ที่นี่วัดแค่ว่า "ไม่พัง"
      - name: pytest ทั้งชุด ยกเว้นเทสต์ที่ประกาศตัวว่าต้องมีไลบรารีของ plugin
        run: |
          set -o pipefail
          pipenv run pytest -q -m "not plugin_deps" | tee bare.log
          # **เขียวเฉย ๆ ไม่พอ ต้องบอกด้วยว่าตัดอะไรออกไป** — job นี้พิสูจน์ได้แค่
          # ส่วนที่มันรันจริง จำนวนที่ถูกข้ามจึงเป็นตัวเลขที่ต้องมีคนเห็นทุกครั้ง
          # ไม่ใช่ตัวเลขที่ต้องไปขุดหาใน log (เพดานของมันอยู่ที่ PLUGIN_DEPS_BUDGET
          # ใน tests/test_plugins.py ซึ่งเป็นด่านที่ทำให้มันโตขึ้นเงียบ ๆ ไม่ได้)
          echo "### โหมด bare: $(tail -1 bare.log)" >> "$GITHUB_STEP_SUMMARY"
        env:
          SECRET_KEY: ci-only-secret-key-not-used-in-production-1234

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pipenv
      - run: pip install pipenv
      - run: pipenv sync --dev
      # `if: !cancelled()` ทุก step เพื่อให้ **ด่านที่แดงตัวแรกไม่บังคับตัวหลังให้เงียบ**
      # เจอมาแล้วตอน Phase 4.5: xenon แดงก่อน job จึงไม่เคยเดินถึง mypy ที่แดงอยู่
      # ด้วยคนละเรื่อง กว่าจะเห็นก็เสียไปอีกหนึ่งรอบ push — รอบ CI แพงกว่าการรัน
      # ห้าคำสั่งจนจบเสมอ
      - run: pipenv run ruff check .
        if: ${{ !cancelled() }}
      - run: pipenv run ruff format --check .
        if: ${{ !cancelled() }}
      - run: pipenv run xenon --max-absolute B --max-modules A --max-average A app
        if: ${{ !cancelled() }}
      - run: pipenv run interrogate app
        if: ${{ !cancelled() }}
      - run: pipenv run mypy app scripts
        if: ${{ !cancelled() }}

  schema:
    # model กับ schema ที่ migration สร้างต้องตรงกันเป๊ะ
    #
    # เทสต์อื่นสร้างตารางด้วย `db.create_all()` ซึ่งสร้างจาก model ตรง ๆ จึงตรงกับ
    # model เสมอโดยนิยาม ต่อให้ migration เขียนอะไรไว้ก็มองไม่เห็น ด่านนี้จึงต้อง
    # ตั้งต้นจากฐานข้อมูลเปล่าแล้ว `flask db upgrade` จริงก่อน ถึงจะมีของให้เทียบ
    #
    # เคยหลุดมาแล้ว: deleted_at มี index ใน migration แต่ model ไม่ได้ประกาศ
    # `flask db migrate` ครั้งถัดไปจะออก migration ที่ drop index ทิ้งเงียบ ๆ
    # (ซ้ำกับ tests/test_migrations.py::test_models_match_the_migrated_schema
    # ตั้งใจให้ซ้ำ — job นี้บอกสาเหตุตรง ๆ โดยไม่ต้องอ่าน traceback ของ pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pipenv
      - run: pip install pipenv
      - run: pipenv sync --dev
      - name: db upgrade แล้วเทียบ model กับ schema (drift ต้องเป็นศูนย์)
        run: |
          pipenv run flask db upgrade
          pipenv run flask db check
        env:
          SECRET_KEY: ci-only-secret-key-not-used-in-production-1234
          DATABASE_URL: sqlite:////tmp/schema-check.db

  openapi:
    # สัญญาที่ commit ไว้ต้องเป็นภาพถ่ายของโค้ดปัจจุบัน ไม่ใช่ของเมื่อสามเดือนก่อน
    #
    # generate ใหม่แล้ว `git diff` ต้องว่าง — เขียนแบบนี้แทนการ commit ไฟล์ให้เอง
    # โดยตั้งใจ: bot ที่ commit เอกสารให้จะกลบการเปลี่ยนสัญญาที่ไม่ได้ตั้งใจ
    # ให้เนียนหายไปใน commit ของ bot แทนที่จะมาอยู่ตรงหน้าคนรีวิวใน PR
    #
    # (ซ้ำกับ tests/test_openapi.py ตั้งใจให้ซ้ำ — job นี้บอกสาเหตุตรง ๆ
    # โดยไม่ต้องอ่าน diff ของ dict ที่ pytest พิมพ์ออกมา)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pipenv
      - run: pip install pipenv
      - run: pipenv sync --dev
      - name: generate แล้วต้องไม่มีอะไรเปลี่ยน
        run: |
          pipenv run python scripts/generate_openapi.py
          git diff --exit-code docs/openapi.json \
            || { echo "docs/openapi.json ไม่ตรงกับโค้ด — รัน scripts/generate_openapi.py แล้ว commit"; exit 1; }
        env:
          PYTHONPATH: .

  commit-lint:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: conventional commits (เฉพาะ commit ใหม่ใน push นี้)
        run: |
          BEFORE="${{ github.event.before }}"
          if git cat-file -e "$BEFORE" 2>/dev/null; then
            python scripts/lint_commits.py --range "$BEFORE..${{ github.sha }}"
          else
            python scripts/lint_commits.py --range "${{ github.sha }}~1..${{ github.sha }}"
          fi

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pipenv
      - run: pip install pipenv
      - run: pipenv sync --dev
      # **ไม่มี step ติดตั้ง category ของ plugin ที่นี่โดยตั้งใจ** — job นี้คือ
      # supply chain ที่ถอดไม่ได้ CVE ที่เจอที่นี่จึงหยุด pipeline ได้เต็มปาก
      # ส่วนของ plugin ถูก audit ในอีก job (`plugin-audit`) ซึ่งบอกได้ว่า CVE
      # เป็นของ plugin ไหน และตอบด้วยการถอดได้ (ADR 0025)
      - name: pip-audit ของ core (อัปเกรด pip ใน venv ก่อน — ตัว pip เองก็ถูก audit)
        run: |
          pipenv run python -m pip install --quiet --upgrade pip
          pipenv run pip-audit
      - name: semgrep (flask + python rulesets)
        run: |
          pip install --quiet semgrep
          semgrep scan --config p/flask --config p/python \
            --exclude migrations --exclude .venv --metrics=off --error --quiet

  plugin-audit:
    # supply chain ของ plugin แยก audit **ทีละ category** เพื่อให้ตอบได้ว่า CVE
    # ตัวนี้เป็นของ plugin ไหน และคำตอบคือ "ถอดตัวนั้นออกก่อน" ได้จริงไหม
    # (ADR 0025) — CVE ของของที่ถอดได้จึง **ไม่ทำให้ job ของ core แดง**
    # แต่ต้องดังพอให้เห็น: ล้มแล้วยิง ::warning:: + เขียนลงสรุปของ run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pipenv
      - run: pip install pipenv
      - run: pipenv sync --dev
      # ไม่ต้องติดตั้งไลบรารีของ plugin — audit จาก lock file ทีละ category
      # ชื่อ category ถามจากตัวแอปเอง **ห้าม hardcode ชื่อ plugin ใน CI**
      - name: แยก requirement ของแต่ละ category ออกมาเป็นไฟล์
        run: |
          for category in $(pipenv run flask plugin-deps --categories); do
            pipenv requirements --categories="$category" > "req-$category.txt"
          done
        env:
          SECRET_KEY: ci-only-secret-key-not-used-in-production-1234
      - name: pip-audit ทีละ category
        id: audit
        continue-on-error: true
        run: |
          shopt -s nullglob
          files=(req-*.txt)
          if [ ${#files[@]} -eq 0 ]; then
            echo "ไม่มี plugin ตัวไหนประกาศไลบรารีไว้ — ไม่มีอะไรต้อง audit"
            exit 0
          fi
          status=0
          for file in "${files[@]}"; do
            category="${file#req-}"
            echo "== ${category%.txt}"
            # `|| status=$?` ไม่ใช่ `if ! cmd; then status=$?` — ในกิ่งนั้น $? เป็น 0 เสมอ
            # (กติกาเดียวกับ scripts/purge_cron.sh) และต้อง audit ให้ครบทุก category
            # ไม่ใช่หยุดที่ตัวแรกที่มี CVE
            pipenv run pip-audit --no-deps -r "$file" || status=$?
          done
          exit $status
      - name: รายงานว่ามี CVE ค้างอยู่ในไลบรารีของ plugin
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::warning title=CVE ในไลบรารีของ plugin::ดู log ของ job นี้ว่าเป็น category ไหน — ถอด plugin ตัวนั้นด้วย DISABLED_PLUGINS ได้ทันทีโดยไม่ต้อง deploy (ADR 0025)"
          {
            echo "### มี CVE ในไลบรารีของ plugin"
            echo
            echo "core ไม่แดงเพราะไลบรารีพวกนี้ **ถอดได้** — แต่ต้องมีคนตัดสินใจ"
            echo "ว่าจะถอด (\`DISABLED_PLUGINS\`) หรืออัปเกรด ดู log ของ job นี้"
          } >> "$GITHUB_STEP_SUMMARY"

  a11y:
    # WCAG 2.2 AA ด้วย browser จริง — ครอบสิ่งที่ tests/test_a11y.py ตรวจไม่ได้
    # (contrast หลัง CSS ทำงาน, ชื่อที่ AT คำนวณได้จริง) สแกนทั้งโหมดมืด ธีม ocean
    # และภาษาไทย เพราะ contrast/ความยาวข้อความต่างกันตามนั้น
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pipenv
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install pipenv
      - run: pipenv sync --dev
      # ไลบรารีของ plugin อยู่นอก `[packages]` (ADR 0025) ต้องติดตั้งแยก —
      # ถามชื่อ category จากตัวแอปเอง **ห้าม hardcode ชื่อ plugin ใน CI**
      - name: ติดตั้ง category ของ plugin ทุกตัวที่ประกาศไว้
        run: pipenv sync --categories="$(pipenv run flask plugin-deps --categories)"
        env:
          SECRET_KEY: ci-only-secret-key-not-used-in-production-1234
      # pin ไว้ให้ผลซ้ำได้ — pa11y ขยับ rule เมื่อไหร่ gate จะไม่ขยับตามเงียบ ๆ
      - run: npm install --no-save pa11y-ci@4.1.1
      - name: เตรียมฐานข้อมูลชั่วคราว + ข้อมูลตัวอย่าง
        run: |
          pipenv run flask db upgrade
          # ตารางของ plugin ไม่ได้อยู่ในสาย migration ของ core (ADR 0023)
          # ต้องติดตั้งแยกเหมือนตอน deploy จริง ไม่งั้นหน้า settings จะไม่มี
          # ส่วนของการยืนยันสองขั้นให้สแกน
          pipenv run flask plugin-install auth/totp
          PYTHONPATH=. pipenv run python scripts/a11y_fixture.py
        env:
          SECRET_KEY: ci-only-secret-key-not-used-in-production-1234
          DATABASE_URL: sqlite:////tmp/a11y.db
      - name: รันแอปแล้วสแกน
        run: |
          pipenv run flask run --port 5099 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:5099/login && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:5099/login || { echo "แอปไม่ขึ้น"; exit 1; }
          ./node_modules/.bin/pa11y-ci --config .pa11yci.json
        # ไม่ต้องปิด rate limit: pa11y login ใหม่ทุก URL ก็จริง แต่ `deduct_when`
        # หักโควตาเฉพาะตอนได้ 401 — login ที่ถูกต้องไม่กินโควตาเลย
        env:
          SECRET_KEY: ci-only-secret-key-not-used-in-production-1234
          DATABASE_URL: sqlite:////tmp/a11y.db

  image:
    # **build image จริงแล้วยิงใส่มัน** — Dockerfile ที่ไม่มีใครเคย build คือไฟล์
    # ข้อความธรรมดา และ image ที่ build ผ่านแต่ไม่เคยถูกรัน ก็บอกได้แค่ว่า syntax ถูก
    # (P5-09 · เครื่อง dev ไม่มี container runtime — CI จึงเป็นที่พิสูจน์)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build
        run: docker build -t todolist:ci .
      - name: ต้องไม่รันเป็น root
        run: |
          who=$(docker run --rm todolist:ci id -un)
          echo "รันในนามของ: $who"
          [ "$who" = "todolist" ] || { echo "image รันเป็น $who ไม่ใช่ todolist"; exit 1; }
      - name: โค้ดใน image ต้องเขียนทับไม่ได้
        run: |
          # process ที่ถูกยึดต้องแก้โค้ดของตัวเองไม่ได้ — ถ้าเขียนได้แปลว่า
          # `chmod a-w` ใน Dockerfile หลุดไปโดยไม่มีอะไรฟ้อง
          for target in /app/run.py /app/instance/probe.db; do
            if docker run --rm todolist:ci sh -c "echo x > $target" 2>/dev/null; then
              echo "เขียน $target ได้ — ไม่ควรเป็นแบบนั้น"
              exit 1
            fi
          done
          # `/app/instance` ตั้งใจให้เขียนไม่ได้ด้วย — ยอมให้เขียนเมื่อไหร่ ค่าเริ่มต้น
          # `sqlite:///todolist.db` จะเก็บข้อมูลลง layer ของ container แล้วหายเงียบ ๆ
          # ตอน restart · พังดัง ๆ ตอน config ผิด ดีกว่าข้อมูลหายโดยไม่มีใครรู้
      - name: ของที่ไม่ควรอยู่ใน image ต้องไม่อยู่
        run: |
          # .dockerignore เป็นด่านเดียวที่กัน .env กับ instance/ ไม่ให้หลุดเข้า layer
          # ลบทีหลังไม่ช่วย เพราะขุดออกมาจาก layer เก่าได้เสมอ
          for path in /app/tests /app/docs /app/.env /app/scripts; do
            if docker run --rm todolist:ci sh -c "test -e $path"; then
              echo "เจอ $path ใน image"
              exit 1
            fi
          done
          # ตรงข้ามกัน: `/app/instance` **ต้องมี** เพราะ `create_app()` เรียก
          # `mkdir(instance_path)` เสมอ — ไม่มีแล้ว container พังตั้งแต่ start
          # (ส่วนที่ว่ามันต้องเขียนไม่ได้ ถูกตรวจไปแล้วใน step ก่อนหน้า)
          docker run --rm todolist:ci sh -c 'test -d /app/instance' || {
            echo "ไม่มี /app/instance — create_app() จะพังตอน start"; exit 1; }
      - name: start จริงแล้วต้องตอบ 200
        run: |
          docker run -d --name probe -p 8000:8000 \
            -e SECRET_KEY=ci-only-secret-key-not-used-in-production-1234 \
            -e DATABASE_URL=sqlite:////tmp/ci.db \
            todolist:ci
          # รอ healthcheck ของ image เอง ไม่ใช่ sleep แบบเดา
          for _ in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Health.Status}}' probe)
            [ "$state" = "healthy" ] && break
            [ "$state" = "unhealthy" ] && { docker logs probe; exit 1; }
            sleep 2
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' probe)" = "healthy" ] || {
            echo "ไม่ healthy ภายในเวลาที่รอ"; docker logs probe; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/login)
          echo "GET /login → $code"
          [ "$code" = "200" ] || { docker logs probe; exit 1; }
      - name: log ของแอปต้องออก stderr ไม่ใช่ stdout
        run: |
          # กติกาเดียวกับที่ commit e5d3e57 ตั้งไว้ — ในคอนเทนเนอร์ก็ต้องจริง
          # (`--access-logfile -` ของ gunicorn ออก stdout ส่วน log ของแอปออก stderr)
          docker logs probe 2>/dev/null | grep -q '"logger": "app"' && {
            echo "log ของแอปโผล่ใน stdout"; exit 1; }
          docker logs probe 2>&1 1>/dev/null | grep -q '"logger"' || {
            echo "ไม่เจอ log ของแอปใน stderr"; exit 1; }
          echo "log อยู่ถูกช่อง"

  stack:
    # **ยิง `docker compose up` จริงแล้วใช้งานแอปผ่าน stack นั้น** (P5-10)
    # DoD ของ Phase 5 คือ "`docker compose up` เลือก backend ได้" ซึ่งพิสูจน์ได้
    # ทางเดียวคือขึ้น stack จริงแล้วเดินเส้นทางจริง: migrate → สร้าง user → login
    #
    # ครอบ override ของ MySQL เพราะเป็นตัวที่มีชิ้นส่วนมากที่สุด (service เพิ่ม,
    # healthcheck เฉพาะยี่ห้อ, `DATABASE_URL` ที่ต้องตรงกับ service นั้น)
    # ส่วน MariaDB ต่างกันแค่ชื่อ image กับคำสั่ง healthcheck ซึ่ง job `dialects`
    # พิสูจน์พฤติกรรมของยี่ห้อนั้นอยู่แล้ว — ที่นี่ตรวจ *การต่อสาย* ของ compose
    #
    # **Keycloak (compose.sso.yaml) ยังไม่อยู่ใน CI** — ยังไม่มีอะไรต่อกับมันจนกว่า
    # จะถึง P5-13 ด่านที่พิสูจน์แค่ "มันขึ้นได้" จ่ายเวลาทุก push โดยไม่ตอบคำถามที่
    # สำคัญ จะเพิ่มพร้อมกับ SSO ตอนที่มีอะไรให้ login ผ่านมันจริง ๆ
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-not-used-in-production-1234
      DB_PASSWORD: ci-only-db-password
      DB_ROOT_PASSWORD: ci-only-root-password
      COMPOSE: docker compose -f compose.yaml -f compose.mysql.yaml
      SCALED: docker compose -f compose.yaml -f compose.mysql.yaml -f compose.scale.yaml
      TLS: docker compose -f compose.yaml -f compose.mysql.yaml -f compose.scale.yaml -f compose.tls.yaml
    steps:
      - uses: actions/checkout@v7
      - name: up
        run: |
          $COMPOSE up -d --build --quiet-pull
          $COMPOSE ps
      - name: ทุก service ต้อง healthy
        run: |
          for _ in $(seq 1 40); do
            unhealthy=$($COMPOSE ps --format '{{.Service}}:{{.Health}}' | grep -v ':healthy' || true)
            [ -z "$unhealthy" ] && break
            sleep 5
          done
          left=$($COMPOSE ps --format '{{.Service}}:{{.Health}}' | grep -v ':healthy' || true)
          if [ -n "$left" ]; then
            echo "ยังไม่ healthy: $left"
            $COMPOSE logs
            exit 1
          fi
      - name: migrate เป็นขั้นตอนแยก ไม่ใช่ผลข้างเคียงของ start
        run: |
          # ก่อน migrate ตารางต้องยังไม่มี — พิสูจน์ว่า image ไม่ได้แอบ migrate ให้เอง
          if $COMPOSE exec -T db mysql -uroot -p"$DB_ROOT_PASSWORD" -N \
               -e "select 1 from todolist.tdl_user limit 1" 2>/dev/null; then
            echo "ตารางมีอยู่แล้วก่อนสั่ง migrate — image migrate ให้เองหรือเปล่า"
            exit 1
          fi
          $COMPOSE run --rm app flask db upgrade
      - name: เดินเส้นทางจริง — สร้าง user แล้ว login ผ่าน CSRF
        run: |
          printf 'ci-stack-verification-phrase\nci-stack-verification-phrase\n' \
            | $COMPOSE run --rm -T app flask create-user somchai
          jar=$(mktemp)
          # หน้า login ต้องเสิร์ฟได้ก่อน แล้วค่อยดึง CSRF token จากฟอร์มจริง
          token=$(curl -sf -c "$jar" http://127.0.0.1:8000/login \
            | grep -oP 'name="csrf_token"[^>]*value="\K[^"]+' | head -1)
          [ -n "$token" ] || { echo "ไม่เจอ csrf_token ในหน้า login"; exit 1; }
          code=$(curl -s -b "$jar" -c "$jar" -o /dev/null -w '%{http_code}' -X POST \
            -d "username=somchai&password=ci-stack-verification-phrase&csrf_token=$token" \
            http://127.0.0.1:8000/login)
          [ "$code" = "302" ] || { echo "POST /login → $code (ควรเป็น 302)"; $COMPOSE logs app; exit 1; }
          home=$(curl -s -b "$jar" -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)
          [ "$home" = "200" ] || { echo "GET / หลัง login → $home"; exit 1; }
      - name: ข้อมูลต้องลงฐานข้อมูลของ stack จริง ไม่ใช่ SQLite ที่ติดมากับ image
        run: |
          rows=$($COMPOSE exec -T db mysql -uroot -p"$DB_ROOT_PASSWORD" -N \
            -e "select count(*) from todolist.tdl_user" 2>/dev/null | tr -d '[:space:]')
          echo "แถวใน tdl_user ของ MySQL: $rows"
          [ "$rows" = "1" ] || { echo "ข้อมูลไม่ได้ลง MySQL"; exit 1; }
      # ---------------------------------------------------------------- P5-11
      # ต่อจาก stack เดิมเพราะ image ถูก build ไปแล้ว — และการ scale ของจริงก็คือ
      # การเพิ่ม replica ให้ stack ที่รันอยู่ ไม่ใช่การขึ้นใหม่ทั้งชุด
      - name: scale เป็น 2 replica หลัง reverse proxy
        run: |
          $SCALED up -d --scale app=2 --quiet-pull
          for _ in $(seq 1 40); do
            unhealthy=$($SCALED ps --format '{{.Service}}:{{.Health}}' | grep -v ':healthy' || true)
            [ -z "$unhealthy" ] && break
            sleep 5
          done
          left=$($SCALED ps --format '{{.Service}}:{{.Health}}' | grep -v ':healthy' || true)
          [ -z "$left" ] || { echo "ยังไม่ healthy: $left"; $SCALED logs; exit 1; }
          [ "$($SCALED ps -q app | wc -l)" = "2" ] || { echo "ไม่ได้ 2 replica"; exit 1; }
      - name: ทั้งสอง replica ต้องได้รับคำขอจริง
        run: |
          # `?probe=` เพื่อแยกออกจาก healthcheck ที่ยิง /login เปล่า ๆ ทุก 30 วิ
          for _ in $(seq 30); do curl -sf -o /dev/null "http://127.0.0.1:8080/login?probe=p5-11"; done
          served=0
          for c in $($SCALED ps -q app); do
            n=$(docker logs "$c" 2>&1 | grep -c 'probe=p5-11' || true)
            echo "$(docker inspect --format '{{.Name}}' "$c") = $n คำขอ"
            [ "$n" -gt 0 ] && served=$((served + 1))
          done
          # **ไม่ได้ตรวจว่าแบ่งเท่ากัน** — nginx cache DNS ตามอายุที่ตั้งไว้ สัดส่วน
          # จึงไม่คงที่ สิ่งที่ต้องจริงคือ replica ที่สอง *ถูกใช้* ไม่ใช่ขึ้นมาเฉย ๆ
          [ "$served" = "2" ] || { echo "มี replica ที่ไม่เคยรับคำขอเลย"; exit 1; }
      - name: แอปต้องเห็นไอพีของ client ไม่ใช่ของ proxy
        run: |
          # **ถามจาก container ไม่ใช่จากชื่อ network** — ชื่อ network มี prefix เป็น
          # ชื่อ project ของ compose ซึ่งมาจากชื่อไดเรกทอรี (ในเครื่องคือ `todolist`
          # แต่ที่ checkout มาคือ `flask-todolist`) การเดาชื่อจึงพังเฉพาะบน CI
          proxy=$($SCALED ps -q proxy)
          proxy_ip=$(docker inspect "$proxy" --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')
          gateway=$(docker inspect "$proxy" --format '{{range .NetworkSettings.Networks}}{{.Gateway}}{{end}}')
          echo "proxy = $proxy_ip / client ที่แท้จริง = $gateway"
          # ถ้า ProxyFix ไม่ทำงาน ทุกบรรทัดจะเป็นไอพีของ container `proxy` แทน
          # แล้ว rate limit ต่อไอพีจะกลายเป็นก้อนเดียวสำหรับคนทั้งโลก (ADR 0027)
          found=0
          for c in $($SCALED ps -q app); do
            # เขียนด้วย `if` เพราะ "grep ไม่เจอ" เป็นสถานะปกติของ replica ที่ไม่ได้
            # รับคำขอนั้น ไม่ใช่ความผิดพลาด — ให้เห็นชัดว่าตั้งใจปล่อยผ่าน
            if docker logs "$c" 2>&1 | grep http_request | grep -q "\"remote_addr\": \"$gateway\""; then
              found=1
            fi
            if docker logs "$c" 2>&1 | grep http_request | grep -q "\"remote_addr\": \"$proxy_ip\""; then
              echo "มี log ที่เห็นไอพีของ proxy เป็นไอพีของผู้ใช้ — ProxyFix ไม่ทำงาน"
              exit 1
            fi
          done
          [ "$found" = "1" ] || {
            echo "ไม่มี log บรรทัดไหนเห็นไอพีของ client เลย"
            $SCALED logs app | grep http_request | tail -5
            exit 1
          }
      - name: โควตา rate limit ต้องเป็นก้อนเดียวข้าม replica
        run: |
          # ค่าเริ่มต้นคือ 5 ครั้ง/นาที **ต่อทั้ง stack** — ถ้า counter อยู่ใน
          # หน่วยความจำของแต่ละ process เพดานจริงจะกลายเป็น 10 (P5-07)
          codes=""
          for _ in $(seq 7); do
            jar=$(mktemp)
            token=$(curl -sf -c "$jar" http://127.0.0.1:8080/login \
              | grep -oP 'name="csrf_token"[^>]*value="\K[^"]+' | head -1)
            codes="$codes $(curl -s -b "$jar" -c "$jar" -o /dev/null -w '%{http_code}' -X POST \
              -d "username=somchai&password=wrong-on-purpose&csrf_token=$token" \
              http://127.0.0.1:8080/login)"
          done
          echo "status ที่ได้:$codes"
          blocked=$(echo "$codes" | tr ' ' '\n' | grep -c '^429$' || true)
          [ "$blocked" -ge 2 ] || {
            echo "ยิงผิด 7 ครั้งแล้วโดนกันแค่ $blocked ครั้ง — counter ไม่ได้แชร์ข้าม replica"
            exit 1
          }
      # ---------------------------------------------------------------- P5-12
      - name: จบ TLS ที่ proxy แล้วเปิด HSTS
        run: |
          ./scripts/dev_tls_cert.sh
          $TLS up -d --scale app=2 --quiet-pull
          for _ in $(seq 1 40); do
            unhealthy=$($TLS ps --format '{{.Service}}:{{.Health}}' | grep -v ':healthy' || true)
            [ -z "$unhealthy" ] && break
            sleep 5
          done
          left=$($TLS ps --format '{{.Service}}:{{.Health}}' | grep -v ':healthy' || true)
          [ -z "$left" ] || { echo "ยังไม่ healthy: $left"; $TLS logs; exit 1; }
      - name: ขา http ต้องส่งต่อไป https ไม่ใช่เสิร์ฟเนื้อหา
        run: |
          # พอ `HTTPS_ENABLED=1` คุกกี้ session มีแฟล็ก `Secure` ซึ่ง browser จะไม่
          # ส่งกลับมาทาง http เลย การเสิร์ฟหน้า login ทาง http จึงเป็นหน้าที่
          # "ทำงานได้" แต่ login ไม่ติด และไม่มี error ให้เห็นทั้งสองฝั่ง
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/login)
          [ "$code" = "301" ] || { echo "http → $code (ควรเป็น 301)"; exit 1; }
      - name: รับเฉพาะ TLS 1.2 กับ 1.3
        run: |
          # **ตรวจตัวที่ต้องผ่านก่อนเสมอ** — `openssl s_client` ล้มเหลวเหมือนกันหมด
          # ไม่ว่าจะเพราะ server ปฏิเสธเวอร์ชันนั้น หรือเพราะไม่มีใครฟังพอร์ตนั้นเลย
          # ถ้าเรียงกลับกัน วันที่ proxy ไม่ขึ้น ด่านนี้จะ "ผ่าน" อย่างสมบูรณ์แบบ
          for new in tls1_2 tls1_3; do
            echo | openssl s_client -connect 127.0.0.1:8443 -$new >/dev/null 2>&1 \
              || { echo "$new ต่อไม่ได้"; exit 1; }
          done
          # ค่าเริ่มต้นของ nginx บางเวอร์ชันยังเปิด 1.0/1.1 อยู่ — การไม่ประกาศ
          # `ssl_protocols` ไม่ใช่ "ใช้ค่าที่ปลอดภัยตามสมัย" แต่คือปล่อยให้ image ตัดสินแทน
          # **`@SECLEVEL=0` จำเป็น ไม่ใช่การผ่อนความเข้ม** — openssl 3 บน ubuntu
          # ปิด TLS 1.0/1.1 ที่ตัว *client* ไว้แล้ว ยิงเปล่า ๆ จะได้ "no protocols
          # available" ซึ่งแปลว่าด่านนี้พิสูจน์แค่ว่า openssl ปฏิเสธเอง ไม่ได้พิสูจน์
          # ว่า nginx ปฏิเสธเลย — ผ่านทุกครั้งแม้ลบ `ssl_protocols` ทิ้ง
          # เปิดแล้วจะได้ `alert protocol version` (alert 70) จาก *server* จริง ๆ
          for old in tls1 tls1_1; do
            if echo | openssl s_client -connect 127.0.0.1:8443 -$old \
                 -cipher 'DEFAULT@SECLEVEL=0' >/dev/null 2>&1; then
              echo "$old ยังต่อได้ — ต้องถูกปฏิเสธ (RFC 8996)"
              exit 1
            fi
          done
      - name: HSTS ต้องมี และมาจากเจ้าของเดียว
        run: |
          n=$(curl -sIk https://127.0.0.1:8443/login | grep -ci 'strict-transport-security' || true)
          # **สองบรรทัดแปลว่ามีสองเจ้าของ** (แอปกับ nginx) ซึ่งจะเพี้ยนจากกันวันที่
          # มีคนแก้ค่าที่เดียว — เจ้าของคือ Talisman ที่เดียวตาม ADR 0010
          [ "$n" = "1" ] || { echo "เจอ header HSTS $n บรรทัด (ต้องเป็น 1)"; exit 1; }
      - name: login ผ่าน https ได้ทั้งเส้น
        run: |
          # **ล้าง counter ก่อน** — ด่าน "โควตาเป็นก้อนเดียว" ข้างบนเพิ่งยิงรหัสผิด
          # จนเต็มโควตาของไอพีนี้ไปแล้ว (ซึ่งคือสิ่งที่มันตั้งใจพิสูจน์) ถ้าไม่ล้าง
          # ด่านนี้จะได้ 429 แล้วรายงานว่า "login ผ่าน https ไม่ได้" ทั้งที่ TLS
          # ไม่เกี่ยวอะไรเลย — โควตาต่อไอพีมีอายุหนึ่งนาที และสองด่านนี้ห่างกัน
          # ไม่ถึงนั้น (ยืนยันด้วยการจำลองลำดับเดียวกันในเครื่อง: ได้ 429 จริง)
          $TLS exec -T redis redis-cli FLUSHALL
          jar=$(mktemp)
          token=$(curl -sfk -c "$jar" https://127.0.0.1:8443/login \
            | grep -oP 'name="csrf_token"[^>]*value="\K[^"]+' | head -1)
          # **ต้องส่ง Referer** — Flask-WTF ตรวจ Referer เทียบกับ url_root เฉพาะคำขอ
          # ที่เป็น https (ขา http ไม่เคยแสดงอาการนี้) browser ส่งให้เองอยู่แล้ว
          # ตัวที่ทำให้ผ่านคือ nginx ส่ง `Host $http_host` ที่มีพอร์ตติดมาด้วย
          code=$(curl -sk -b "$jar" -c "$jar" -o /dev/null -w '%{http_code}' \
            -e https://127.0.0.1:8443/login -X POST \
            -d "username=somchai&password=ci-stack-verification-phrase&csrf_token=$token" \
            https://127.0.0.1:8443/login)
          [ "$code" = "302" ] || { echo "POST /login ทาง https → $code"; $TLS logs app; exit 1; }
          home=$(curl -sk -b "$jar" -o /dev/null -w '%{http_code}' https://127.0.0.1:8443/)
          [ "$home" = "200" ] || { echo "GET / ทาง https → $home"; exit 1; }
          # คุกกี้ต้องมีแฟล็ก Secure (คอลัมน์ที่ 4 ของ cookie jar แบบ netscape)
          grep -i session "$jar" | awk '{ if ($4 != "TRUE") { print "คุกกี้ไม่มีแฟล็ก Secure"; exit 1 } }'
      - name: เก็บกวาด
        if: always()
        run: $TLS down -v --remove-orphans

  sso:
    # **login กับ IdP จริง ไม่ใช่ mock** (P5-13 · ADR 0028)
    # DoD ของ P5-13 เขียนไว้แบบนั้นตั้งแต่ ROADMAP และเป็นเหตุผลที่ SSO ถูกเลื่อน
    # จาก Phase 4 มาที่นี่ — `tests/test_oidc.py` ตรวจ *ตรรกะ* ด้วย IdP ปลอม
    # ส่วน job นี้ตอบคนละคำถาม: โพรโทคอลที่เราเขียนเองคุยกับของจริงรู้เรื่องไหม
    #
    # **แยก job ไม่รวมกับ `stack`** เพราะเป็นคนละ topology (ที่นั่น app ไม่ได้
    # publish พอร์ตของตัวเองแล้วตั้งแต่เฟส scale) และตอบคนละคำถาม
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-not-used-in-production-1234
      KEYCLOAK_ADMIN_PASSWORD: ci-only-keycloak-admin-password
      IDP_PASSWORD: ci-only-idp-password-not-a-real-one
      COMPOSE: docker compose -f compose.yaml -f compose.sso.yaml
    steps:
      - uses: actions/checkout@v7
      - name: up
        run: |
          $COMPOSE up -d --build --quiet-pull
          for _ in $(seq 1 60); do
            unhealthy=$($COMPOSE ps --format '{{.Service}}:{{.Health}}' | grep -v ':healthy' || true)
            [ -z "$unhealthy" ] && break
            sleep 5
          done
          left=$($COMPOSE ps --format '{{.Service}}:{{.Health}}' | grep -v ':healthy' || true)
          [ -z "$left" ] || { echo "ยังไม่ healthy: $left"; $COMPOSE logs; exit 1; }
      - name: เตรียมฝั่งแอป — migrate, ติดตั้งตารางของ plugin, สร้างบัญชี
        run: |
          $COMPOSE run --rm app flask db upgrade
          # **ตารางของ plugin อยู่นอกสาย migration ของ core** ต้องสั่งเอง (ADR 0023)
          # ไม่สั่งแล้ว plugin ถูกข้ามไปเงียบ ๆ และ job นี้จะพังที่ step ถัดไป
          # ด้วย "หน้า login ไม่มีปุ่มของ IdP" ซึ่งเป็นอาการที่ถูกต้อง
          $COMPOSE run --rm app flask plugin-install auth/oidc
          # บัญชีที่นี่ต้องมีอยู่ก่อน เพราะ OIDC_AUTO_CREATE ปิดไว้ (ADR 0028 ข้อ 3)
          printf 'ci-stack-verification-phrase\nci-stack-verification-phrase\n' \
            | $COMPOSE run --rm -T app flask create-user somchai
      - name: หน้า login ต้องเสนอผู้ให้บริการที่ติดตั้งอยู่
        run: |
          curl -sf http://127.0.0.1:8000/login | grep -q '/login/sso/auth/oidc' \
            || { echo "ไม่มีปุ่มของ IdP บนหน้า login"; exit 1; }
      - name: login ผ่าน IdP จริงทั้งเส้น
        run: |
          jar=$(mktemp)
          # **`--resolve` ไม่ใช่การแก้ config** — `issuer` ต้องเป็นสตริงเดียวกัน
          # ทั้งจากในและนอก stack เพราะมันถูกเทียบตรง ๆ กับ `iss` ใน ID token
          # ฝั่งแอปคุยกับ `keycloak:8080` ผ่าน DNS ของ docker ส่วน curl (ที่ทำตัว
          # เป็น browser) ต้องถูกบอกว่าชื่อนั้นอยู่ที่ไหน มิฉะนั้นต้องไปแก้ issuer
          # ให้ต่างกันสองที่ ซึ่งคือการทำให้ `iss` ไม่มีวันตรง
          resolve="--resolve keycloak:8080:127.0.0.1"
          page=$(curl -sSL $resolve -c "$jar" -b "$jar" http://127.0.0.1:8000/login/sso/auth/oidc)
          # ฟอร์ม login ของ Keycloak — action มี session code ที่ใช้ได้ครั้งเดียว
          action=$(printf '%s' "$page" | grep -oP 'action="\K[^"]+' | head -1 | sed 's/&amp;/\&/g')
          [ -n "$action" ] || { echo "ไม่เจอฟอร์ม login ของ IdP"; printf '%s' "$page" | head -40; exit 1; }
          landed=$(curl -sSL $resolve -c "$jar" -b "$jar" -o /dev/null -w '%{url_effective}' \
            -d "username=somchai&password=$IDP_PASSWORD&credentialId=" "$action")
          echo "ปลายทางหลังใส่รหัสที่ IdP: $landed"
          case "$landed" in
            http://127.0.0.1:8000/*) ;;
            *) echo "ไม่ได้กลับมาที่แอป — ค้างอยู่ที่ IdP"; $COMPOSE logs app | tail -30; exit 1 ;;
          esac
          home=$(curl -s -b "$jar" -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)
          [ "$home" = "200" ] || { echo "GET / หลัง SSO → $home"; $COMPOSE logs app | tail -30; exit 1; }
      - name: กลุ่มใน IdP ต้องกลายเป็นบทบาทที่นี่
        run: |
          # ผู้ใช้ถูกสร้างเป็น `user` ธรรมดา แล้วต้องถูกยกเป็น admin ตอน login
          # เพราะอยู่ในกลุ่ม `todolist-admins` ของ realm (ADR 0028 ข้อ 5)
          $COMPOSE run --rm -T app flask list-users | grep -q 'somchai.*admin' \
            || { echo "บทบาทไม่ได้ตามกลุ่มของ IdP"; $COMPOSE run --rm -T app flask list-users; exit 1; }
      - name: เก็บกวาด
        if: always()
        run: $COMPOSE down -v --remove-orphans

  ldap:
    # **bind กับ directory จริง ไม่ใช่ mock** (P5-14 · ADR 0029)
    # DoD เดียวกับ job `sso` และด้วยเหตุผลเดียวกัน — `tests/test_ldap.py` ตรวจ
    # *ตรรกะของเรา* ด้วย connection ปลอม ส่วนที่นี่ตอบว่าโค้ดที่เราเขียนคุยกับ
    # OpenLDAP ของจริงรู้เรื่องไหม · สองอย่างนี้แทนกันไม่ได้: รอบแรกที่ต่อของจริง
    # เจอสองเรื่องที่ connection ปลอมไม่มีวันเจอ (ldap3 ปฏิเสธ `memberOf` ตาม
    # schema, และ overlay `memberOf` ไม่เติมย้อนหลังให้สมาชิกที่มีอยู่ก่อน)
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-not-used-in-production-1234
      DIRECTORY_PASSWORD: ci-only-directory-password-not-a-real-one
      LOCAL_PASSWORD: ci-only-local-password-phrase
      COMPOSE: docker compose -f compose.yaml -f compose.ldap.yaml
    steps:
      - uses: actions/checkout@v7
      - name: up
        run: |
          $COMPOSE up -d --build --quiet-pull
          for _ in $(seq 1 40); do
            unhealthy=$($COMPOSE ps --format '{{.Service}}:{{.Health}}' | grep -v ':healthy' || true)
            [ -z "$unhealthy" ] && break
            sleep 5
          done
          left=$($COMPOSE ps --format '{{.Service}}:{{.Health}}' | grep -v ':healthy' || true)
          [ -z "$left" ] || { echo "ยังไม่ healthy: $left"; $COMPOSE logs; exit 1; }
      - name: เตรียมฝั่งแอป — migrate, ติดตั้งตารางของ plugin, สร้างบัญชี
        run: |
          $COMPOSE run --rm app flask db upgrade
          $COMPOSE run --rm app flask plugin-install auth/ldap
          # บัญชีนี้มีรหัสผ่าน *ของที่นี่* คนละตัวกับรหัสใน directory โดยตั้งใจ —
          # เพื่อให้แยกออกว่าการ login แต่ละครั้งผ่านทางไหน
          printf "$LOCAL_PASSWORD\n$LOCAL_PASSWORD\n" \
            | $COMPOSE run --rm -T app flask create-user somchai
      - name: login ด้วยรหัสของ directory จริง
        run: |
          jar=$(mktemp)
          token=$(curl -sf -c "$jar" http://127.0.0.1:8000/login \
            | grep -oP 'name="csrf_token"[^>]*value="\K[^"]+' | head -1)
          code=$(curl -s -b "$jar" -c "$jar" -o /dev/null -w '%{http_code}' -X POST \
            -d "username=somchai&password=$DIRECTORY_PASSWORD&csrf_token=$token" \
            http://127.0.0.1:8000/login)
          [ "$code" = "302" ] || { echo "POST /login ด้วยรหัสของ directory → $code"; $COMPOSE logs app | tail -30; exit 1; }
          home=$(curl -s -b "$jar" -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)
          [ "$home" = "200" ] || { echo "GET / หลัง login → $home"; exit 1; }
      - name: กลุ่มใน directory ต้องกลายเป็นบทบาทที่นี่
        run: |
          # ผู้ใช้ถูกสร้างเป็น `user` แล้วต้องถูกยกเป็น admin ตอน login เพราะอยู่ใน
          # กลุ่ม `todolist-admins` — **ค้นจากฝั่งกลุ่ม ไม่ใช่อ่าน `memberOf`**
          # ซึ่งเป็นความต่างที่ทำให้ข้อนี้ทำงานกับ OpenLDAP ล้วน ๆ ได้
          $COMPOSE run --rm -T app flask list-users | grep -q 'somchai.*admin' \
            || { echo "บทบาทไม่ได้ตามกลุ่มของ directory"; $COMPOSE run --rm -T app flask list-users; exit 1; }
      - name: รหัสผ่านของที่นี่ต้องยังใช้ได้ และรหัสว่างต้องไม่ผ่าน
        run: |
          # ADR 0029 ข้อ 2: วันที่ directory ล่ม ทางเข้าสำรองคือสิ่งเดียวที่ช่วยได้
          jar=$(mktemp)
          token=$(curl -sf -c "$jar" http://127.0.0.1:8000/login \
            | grep -oP 'name="csrf_token"[^>]*value="\K[^"]+' | head -1)
          code=$(curl -s -b "$jar" -c "$jar" -o /dev/null -w '%{http_code}' -X POST \
            -d "username=somchai&password=$LOCAL_PASSWORD&csrf_token=$token" \
            http://127.0.0.1:8000/login)
          [ "$code" = "302" ] || { echo "รหัสผ่านของที่นี่ใช้ไม่ได้แล้ว → $code"; exit 1; }
          # ADR 0029 ข้อ 5: รหัสผ่านว่างคือ unauthenticated bind ที่ directory
          # จำนวนมากตอบสำเร็จ — ด่านนี้ต้องอยู่ที่เรา ไม่ใช่ที่ปลายทาง
          jar2=$(mktemp)
          token2=$(curl -sf -c "$jar2" http://127.0.0.1:8000/login \
            | grep -oP 'name="csrf_token"[^>]*value="\K[^"]+' | head -1)
          blank=$(curl -s -b "$jar2" -c "$jar2" -o /dev/null -w '%{http_code}' -X POST \
            -d "username=somchai&password=&csrf_token=$token2" http://127.0.0.1:8000/login)
          [ "$blank" = "401" ] || { echo "รหัสผ่านว่างได้ $blank ซึ่งไม่ใช่ 401"; exit 1; }
      - name: เก็บกวาด
        if: always()
        run: $COMPOSE down -v --remove-orphans

  vault:
    # **อ่านความลับจาก Vault จริง ไม่ใช่ mock** (P5-15 · ADR 0030)
    # `tests/test_secrets.py` ปลอมชั้น `hvac` ไว้ซึ่งตรวจ *ตรรกะของเรา*
    # ส่วนที่นี่ตอบว่าโค้ดที่เราเขียนคุยกับ Vault ของจริงรู้เรื่องไหม —
    # ความต่างนั้นไม่เล็ก (P5-14: connection ปลอมผ่านหมด แต่ของจริงเจอสองบั๊ก)
    #
    # **`SECRET_KEY` ถูกตั้งเป็นค่าว่างใน compose.vault.yaml โดยตั้งใจ** แอปจึง
    # start ได้ก็ต่อเมื่ออ่านค่าจาก Vault สำเร็จเท่านั้น — ด่านนี้จึงพิสูจน์
    # "ความลับมาจาก Vault" ไม่ใช่แค่ "stack ขึ้นได้"
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-value-that-compose-overrides-to-empty
      VAULT_TOKEN: ci-only-vault-root-token
      VAULT_SEEDED_SECRET_KEY: this-key-exists-only-inside-vault-nowhere-else
      LOCAL_PASSWORD: ci-only-local-password-phrase
      COMPOSE: docker compose -f compose.yaml -f compose.vault.yaml
    steps:
      - uses: actions/checkout@v7
      - name: up
        run: |
          $COMPOSE up -d --build --quiet-pull
          for _ in $(seq 1 40); do
            unhealthy=$($COMPOSE ps --format '{{.Service}}:{{.Health}}' | grep -v ':healthy' || true)
            [ -z "$unhealthy" ] && break
            sleep 5
          done
          left=$($COMPOSE ps --format '{{.Service}}:{{.Health}}' | grep -v ':healthy' || true)
          [ -z "$left" ] || { echo "ยังไม่ healthy: $left"; $COMPOSE logs; exit 1; }
      - name: ความลับต้องไม่อยู่ใน environment ของ container
        run: |
          value=$(docker inspect "$($COMPOSE ps -q app)" \
            --format '{{range .Config.Env}}{{println .}}{{end}}' | grep '^SECRET_KEY=' | cut -d= -f2-)
          [ -z "$value" ] || { echo "SECRET_KEY ยังอยู่ใน env ของ container"; exit 1; }
          $COMPOSE logs app | grep -q '"secrets_source": "secrets/vault"' \
            || { echo "แอปไม่ได้ใช้ Vault เป็นแหล่ง"; $COMPOSE logs app | tail -20; exit 1; }
      - name: แอปใช้งานได้จริงด้วยคีย์ที่มาจาก Vault
        run: |
          # คุกกี้ session ถูกเซ็นด้วยคีย์นั้น — login ผ่านแปลว่าคีย์ใช้ได้จริง
          # ไม่ใช่แค่ถูกอ่านมาแล้ววางทิ้งไว้
          $COMPOSE run --rm app flask db upgrade
          printf "$LOCAL_PASSWORD\n$LOCAL_PASSWORD\n" \
            | $COMPOSE run --rm -T app flask create-user somchai
          jar=$(mktemp)
          token=$(curl -sf -c "$jar" http://127.0.0.1:8000/login \
            | grep -oP 'name="csrf_token"[^>]*value="\K[^"]+' | head -1)
          code=$(curl -s -b "$jar" -c "$jar" -o /dev/null -w '%{http_code}' -X POST \
            -d "username=somchai&password=$LOCAL_PASSWORD&csrf_token=$token" \
            http://127.0.0.1:8000/login)
          [ "$code" = "302" ] || { echo "POST /login → $code"; $COMPOSE logs app | tail -20; exit 1; }
          home=$(curl -s -b "$jar" -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)
          [ "$home" = "200" ] || { echo "GET / → $home"; exit 1; }
      - name: ค่าความลับต้องไม่โผล่ใน log เลย
        run: |
          # ADR 0030: log ได้แค่ *ชื่อ* กับ *แหล่งที่ตอบ* — ห้ามมีค่าเด็ดขาด
          if $COMPOSE logs | grep -q "$VAULT_SEEDED_SECRET_KEY"; then
            echo "ค่าความลับโผล่ใน log"
            exit 1
          fi
      - name: Vault ที่ถามไม่ได้ต้องทำให้ไม่ start ไม่ใช่ตกกลับไปใช้ env
        run: |
          # **นี่คือด่านที่สำคัญที่สุดของ job นี้** (ADR 0030 ข้อ 6) — การตกกลับ
          # เงียบ ๆ แปลว่าวันที่ Vault ล่ม ระบบจะรันต่อด้วยความลับชุดเก่าที่ยัง
          # ค้างอยู่ใน env โดยไม่มีใครรู้ ซึ่งแย่กว่าการไม่ start เสียอีก
          for broken in \
            "vault+http://vault:8200/secret/not-seeded-here" \
            "vault+http://vault-does-not-exist:8200/secret/todolist"; do
            if $COMPOSE run --rm -T \
                 -e SECRETS_URL="$broken" \
                 -e SECRET_KEY=a-fallback-value-that-must-never-be-used-here \
                 app flask --help >/dev/null 2>&1; then
              echo "แอป start ได้ทั้งที่ $broken ถามไม่ได้ — แปลว่าตกกลับไปใช้ env"
              exit 1
            fi
          done
      - name: เก็บกวาด
        if: always()
        run: $COMPOSE down -v --remove-orphans

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pipenv
      - run: pip install pipenv
      - run: pipenv sync --dev
      # แยกเป็นไฟล์ละ category ด้วยเหตุผลเดียวกับ pip-audit: SBOM ที่รวมทุกอย่าง
      # เป็นก้อนเดียวตอบไม่ได้ว่า "ถอด plugin ตัวนี้แล้ว component ไหนหายไปบ้าง"
      # ซึ่งเป็นคำถามแรกของวันที่ CVE ออก (ADR 0025)
      - run: pipenv run cyclonedx-py environment -o sbom-core.json
      - name: SBOM ของแต่ละ category ของ plugin
        run: |
          for category in $(pipenv run flask plugin-deps --categories); do
            pipenv requirements --categories="$category" > "req-$category.txt"
            pipenv run cyclonedx-py requirements "req-$category.txt" -o "sbom-$category.json"
          done
        env:
          SECRET_KEY: ci-only-secret-key-not-used-in-production-1234
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom-*.json
