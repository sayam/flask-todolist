# Phase 0 quality gates — ทุก push ต้องเขียว (ดู docs/ROADMAP.md)
# คำสั่งทุกตัว mirror จากที่รันผ่านบนเครื่อง dev แล้ว — CI ไม่มีคำสั่งพิเศษของตัวเอง
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # **redis จริงเพื่อให้เทสต์ที่ต้องมี store ที่แชร์ได้ *รันจริงทุก push*** (P5-07)
    # ก่อนหน้านี้เทสต์พวกนั้นข้ามตัวเองเสมอใน CI เพราะไม่มีใครตั้ง `TEST_REDIS_URL`
    # แปลว่า "พิสูจน์แล้ว" หมายถึง "พิสูจน์บนเครื่องคนเขียนครั้งเดียว" ซึ่งไม่ใช่
    # สิ่งเดียวกันเลย — โดยเฉพาะกับข้อที่ปิดหนี้เรื่องโควตาที่นับแยกต่อ process
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pipenv
      - run: pip install pipenv
      - run: pipenv sync --dev
      # ไลบรารีของ plugin อยู่นอก `[packages]` (ADR 0025) ต้องติดตั้งแยก —
      # ถามชื่อ category จากตัวแอปเอง **ห้าม hardcode ชื่อ plugin ใน CI**
      - name: ติดตั้ง category ของ plugin ทุกตัวที่ประกาศไว้
        run: pipenv sync --categories="$(pipenv run flask plugin-deps --categories)"
        env:
          SECRET_KEY: ci-only-secret-key-not-used-in-production-1234
      - name: pytest + coverage gate (fail_under ใน pyproject)
        run: pipenv run pytest -q --cov --cov-report=xml
        env:
          SECRET_KEY: ci-only-secret-key-not-used-in-production-1234
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
      - name: diff-cover (บรรทัดที่แก้ต้องมีเทสต์ 100%)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=50
          pipenv run diff-cover coverage.xml --compare-branch origin/${{ github.base_ref }} --fail-under 100

  dialects:
    # **ยิงชุดเทสต์ทั้งชุดใส่ MySQL กับ MariaDB จริง** (ADR 0026 · P5-04)
    # job `test` รันบน SQLite ซึ่งให้อภัยหลายอย่างที่ยี่ห้ออื่นไม่ให้ — ที่เจอจริง
    # ตอนเปิด job นี้ครั้งแรก: fixture สี่ตัวสร้างตารางเองแล้วไม่เก็บกวาด ซึ่งบน
    # `sqlite:///:memory:` ไม่เคยเป็นปัญหาเพราะฐานตายไปพร้อม engine
    #
    # ใช้ service container ของ GitHub Actions จึงไม่ต้องมี runtime บนเครื่อง dev
    # (ในเครื่องจะยิงเองก็ตั้ง MySQL/MariaDB ที่ไหนก็ได้แล้วส่ง TEST_DATABASE_URL มา)
    name: dialect (${{ matrix.db.name }})
    runs-on: ubuntu-latest
    strategy:
      # **ห้าม fail-fast** — อยากเห็นว่าพังยี่ห้อเดียวหรือทั้งสอง ซึ่งเป็นคนละอาการ
      fail-fast: false
      matrix:
        db:
          # **คำสั่ง health ต่างกันตามยี่ห้อโดยจำเป็น** — `mysqladmin` ไม่มีใน image
          # ของ MariaDB 11 แล้ว (ตัดชื่อเก่าออก เหลือ `mariadb-admin`) ใช้ตัวเดียวกัน
          # ทั้งคู่แล้ว service container จะขึ้น unhealthy ทั้งที่ตัวฐานข้อมูลไม่ได้พัง
          # — เจอจริงตอน push แรกของ job นี้ และเครื่อง dev ไม่เจอเพราะ Debian package
          # ยังมี symlink ชื่อเก่าให้อยู่
          - name: mysql-8
            image: mysql:8
            scheme: mysql+pymysql
            ping: mysqladmin
          - name: mariadb-11
            image: mariadb:11
            scheme: mariadb+pymysql
            ping: mariadb-admin
    services:
      db:
        image: ${{ matrix.db.image }}
        env:
          # image ของ mariadb รับตัวแปรชื่อ MYSQL_* ด้วยเพื่อความเข้ากันได้
          MYSQL_ROOT_PASSWORD: ci-only-not-a-real-password
          MYSQL_DATABASE: todolist_test
        ports:
          - 3306:3306
        # ไม่มี health check = เทสต์เริ่มก่อน server พร้อม แล้วแดงด้วย
        # "Can't connect" ซึ่งอ่านแล้วนึกว่าโค้ดผิด
        options: >-
          --health-cmd="${{ matrix.db.ping }} ping -h 127.0.0.1 -uroot -pci-only-not-a-real-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pipenv
      - run: pip install pipenv
      - run: pipenv sync --dev
      # driver ของยี่ห้อพวกนี้อยู่ใน category ของ plugin ชนิด `db` (ADR 0026)
      # ถามชื่อจากตัวแอปเอง **ห้าม hardcode ชื่อ plugin ใน CI**
      - name: ติดตั้ง category ของ plugin ทุกตัวที่ประกาศไว้
        run: pipenv sync --categories="$(pipenv run flask plugin-deps --categories)"
        env:
          SECRET_KEY: ci-only-secret-key-not-used-in-production-1234
      # ไม่มี coverage gate ที่นี่ — เพดานวัดจาก job `test` ที่เดียว
      # job นี้ตอบคำถามเดียว: พฤติกรรมเหมือนกันทุกยี่ห้อไหม
      - name: pytest ทั้งชุดบน ${{ matrix.db.name }}
        run: pipenv run pytest -q
        env:
          SECRET_KEY: ci-only-secret-key-not-used-in-production-1234
          TEST_DATABASE_URL: >-
            ${{ matrix.db.scheme }}://root:ci-only-not-a-real-password@127.0.0.1:3306/todolist_test

  bare:
    # job `test` แต่ **ไม่มี step ติดตั้ง category ของ plugin** (ADR 0025 ข้อ 7)
    # นี่คือด่านเดียวที่ทำให้ "ถอดส่วนเสริมแล้วไม่พัง" เป็นข้อเท็จจริงที่วัดได้
    # ทุก push แทนที่จะเป็นความตั้งใจที่เขียนไว้ในเอกสาร — และมันคือสภาพของ
    # เครื่องที่ `pipenv sync --dev` เฉย ๆ ได้ ซึ่งคือค่าเริ่มต้นของทุกคนที่ clone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pipenv
      - run: pip install pipenv
      - run: pipenv sync --dev
      # ถ้าวันหนึ่งไลบรารีของ plugin เผลอย้ายกลับเข้า `[packages]` ของ core
      # job นี้จะยังเขียวทั้งที่ไม่ได้พิสูจน์อะไรเลย — ตรวจก่อนว่ามันหายไปจริง
      # ถามสถานะจากตัวแอปเอง **ห้าม hardcode ชื่อ plugin หรือชื่อไลบรารีใน CI**
      - name: ยืนยันว่าไม่มีไลบรารีของ plugin ตัวไหนติดตั้งอยู่
        run: |
          set -o pipefail
          # **เก็บ output ก่อนแล้วค่อยนับ** ไม่ใช่ต่อท่อยาวเส้นเดียว — exit code
          # ของ `x=$(cmd | awk | wc -l)` มาจาก `wc` เสมอ (= 0) คำสั่งที่พังจึง
          # กลายเป็น "ไม่มีไลบรารีติดตั้งอยู่" ซึ่งคือคำว่า *ผ่าน* ของด่านนี้พอดี
          # (ตระกูลเดียวกับ `if ! cmd; then status=$?` ใน scripts/purge_cron.sh)
          deps=$(pipenv run flask plugin-deps)
          categories=$(pipenv run flask plugin-deps --categories)
          # ด่านนี้อ่านคอลัมน์ที่สามด้วย awk รูปแบบบรรทัดจึงเป็นสัญญา ไม่ใช่การจัดหน้า
          # (ตรึงไว้ด้วย `test_plugin_deps_rows_are_a_contract_that_ci_reads`)
          # ถ้ารูปแบบเปลี่ยนไปโดยไม่มีใครแก้ตรงนี้ awk จะนับได้ 0 แล้ว job นี้จะ
          # เขียวโดยไม่ได้ตรวจอะไรเลย — เทียบกับ `--categories` เพื่อจับกรณีนั้น
          readable=$(printf '%s\n' "$deps" | awk -F'\t' '$3 == "ok" || $3 == "MISSING"' | wc -l)
          if [ -n "$categories" ] && [ "$readable" = "0" ]; then
            echo "มีจุด plug ที่ประกาศไลบรารีไว้ ($categories) แต่อ่านสถานะจาก plugin-deps ไม่ได้"
            echo "รูปแบบ output เปลี่ยนไปแล้วหรือเปล่า — ด่านนี้อ่านคอลัมน์ที่สามเป็น ok/MISSING"
            printf '%s\n' "$deps"
            exit 1
          fi
          installed=$(printf '%s\n' "$deps" | awk -F'\t' '$3 == "ok"' | wc -l)
          if [ "$installed" != "0" ]; then
            echo "โหมด bare แต่ยังมีไลบรารีของ plugin ติดตั้งอยู่ $installed รายการ"
            printf '%s\n' "$deps"
            exit 1
          fi
        env:
          SECRET_KEY: ci-only-secret-key-not-used-in-production-1234
      # ไม่มี coverage gate ที่นี่ — โหมดนี้ไม่ได้เดินโค้ดของส่วนเสริมเลย
      # เพดาน coverage วัดจาก job `test` ที่ติดตั้งครบ ที่นี่วัดแค่ว่า "ไม่พัง"
      - name: pytest ทั้งชุด ยกเว้นเทสต์ที่ประกาศตัวว่าต้องมีไลบรารีของ plugin
        run: |
          set -o pipefail
          pipenv run pytest -q -m "not plugin_deps" | tee bare.log
          # **เขียวเฉย ๆ ไม่พอ ต้องบอกด้วยว่าตัดอะไรออกไป** — job นี้พิสูจน์ได้แค่
          # ส่วนที่มันรันจริง จำนวนที่ถูกข้ามจึงเป็นตัวเลขที่ต้องมีคนเห็นทุกครั้ง
          # ไม่ใช่ตัวเลขที่ต้องไปขุดหาใน log (เพดานของมันอยู่ที่ PLUGIN_DEPS_BUDGET
          # ใน tests/test_plugins.py ซึ่งเป็นด่านที่ทำให้มันโตขึ้นเงียบ ๆ ไม่ได้)
          echo "### โหมด bare: $(tail -1 bare.log)" >> "$GITHUB_STEP_SUMMARY"
        env:
          SECRET_KEY: ci-only-secret-key-not-used-in-production-1234

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pipenv
      - run: pip install pipenv
      - run: pipenv sync --dev
      # `if: !cancelled()` ทุก step เพื่อให้ **ด่านที่แดงตัวแรกไม่บังคับตัวหลังให้เงียบ**
      # เจอมาแล้วตอน Phase 4.5: xenon แดงก่อน job จึงไม่เคยเดินถึง mypy ที่แดงอยู่
      # ด้วยคนละเรื่อง กว่าจะเห็นก็เสียไปอีกหนึ่งรอบ push — รอบ CI แพงกว่าการรัน
      # ห้าคำสั่งจนจบเสมอ
      - run: pipenv run ruff check .
        if: ${{ !cancelled() }}
      - run: pipenv run ruff format --check .
        if: ${{ !cancelled() }}
      - run: pipenv run xenon --max-absolute B --max-modules A --max-average A app
        if: ${{ !cancelled() }}
      - run: pipenv run interrogate app
        if: ${{ !cancelled() }}
      - run: pipenv run mypy app scripts
        if: ${{ !cancelled() }}

  schema:
    # model กับ schema ที่ migration สร้างต้องตรงกันเป๊ะ
    #
    # เทสต์อื่นสร้างตารางด้วย `db.create_all()` ซึ่งสร้างจาก model ตรง ๆ จึงตรงกับ
    # model เสมอโดยนิยาม ต่อให้ migration เขียนอะไรไว้ก็มองไม่เห็น ด่านนี้จึงต้อง
    # ตั้งต้นจากฐานข้อมูลเปล่าแล้ว `flask db upgrade` จริงก่อน ถึงจะมีของให้เทียบ
    #
    # เคยหลุดมาแล้ว: deleted_at มี index ใน migration แต่ model ไม่ได้ประกาศ
    # `flask db migrate` ครั้งถัดไปจะออก migration ที่ drop index ทิ้งเงียบ ๆ
    # (ซ้ำกับ tests/test_migrations.py::test_models_match_the_migrated_schema
    # ตั้งใจให้ซ้ำ — job นี้บอกสาเหตุตรง ๆ โดยไม่ต้องอ่าน traceback ของ pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pipenv
      - run: pip install pipenv
      - run: pipenv sync --dev
      - name: db upgrade แล้วเทียบ model กับ schema (drift ต้องเป็นศูนย์)
        run: |
          pipenv run flask db upgrade
          pipenv run flask db check
        env:
          SECRET_KEY: ci-only-secret-key-not-used-in-production-1234
          DATABASE_URL: sqlite:////tmp/schema-check.db

  openapi:
    # สัญญาที่ commit ไว้ต้องเป็นภาพถ่ายของโค้ดปัจจุบัน ไม่ใช่ของเมื่อสามเดือนก่อน
    #
    # generate ใหม่แล้ว `git diff` ต้องว่าง — เขียนแบบนี้แทนการ commit ไฟล์ให้เอง
    # โดยตั้งใจ: bot ที่ commit เอกสารให้จะกลบการเปลี่ยนสัญญาที่ไม่ได้ตั้งใจ
    # ให้เนียนหายไปใน commit ของ bot แทนที่จะมาอยู่ตรงหน้าคนรีวิวใน PR
    #
    # (ซ้ำกับ tests/test_openapi.py ตั้งใจให้ซ้ำ — job นี้บอกสาเหตุตรง ๆ
    # โดยไม่ต้องอ่าน diff ของ dict ที่ pytest พิมพ์ออกมา)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pipenv
      - run: pip install pipenv
      - run: pipenv sync --dev
      - name: generate แล้วต้องไม่มีอะไรเปลี่ยน
        run: |
          pipenv run python scripts/generate_openapi.py
          git diff --exit-code docs/openapi.json \
            || { echo "docs/openapi.json ไม่ตรงกับโค้ด — รัน scripts/generate_openapi.py แล้ว commit"; exit 1; }
        env:
          PYTHONPATH: .

  commit-lint:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: conventional commits (เฉพาะ commit ใหม่ใน push นี้)
        run: |
          BEFORE="${{ github.event.before }}"
          if git cat-file -e "$BEFORE" 2>/dev/null; then
            python scripts/lint_commits.py --range "$BEFORE..${{ github.sha }}"
          else
            python scripts/lint_commits.py --range "${{ github.sha }}~1..${{ github.sha }}"
          fi

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pipenv
      - run: pip install pipenv
      - run: pipenv sync --dev
      # **ไม่มี step ติดตั้ง category ของ plugin ที่นี่โดยตั้งใจ** — job นี้คือ
      # supply chain ที่ถอดไม่ได้ CVE ที่เจอที่นี่จึงหยุด pipeline ได้เต็มปาก
      # ส่วนของ plugin ถูก audit ในอีก job (`plugin-audit`) ซึ่งบอกได้ว่า CVE
      # เป็นของ plugin ไหน และตอบด้วยการถอดได้ (ADR 0025)
      - name: pip-audit ของ core (อัปเกรด pip ใน venv ก่อน — ตัว pip เองก็ถูก audit)
        run: |
          pipenv run python -m pip install --quiet --upgrade pip
          pipenv run pip-audit
      - name: semgrep (flask + python rulesets)
        run: |
          pip install --quiet semgrep
          semgrep scan --config p/flask --config p/python \
            --exclude migrations --exclude .venv --metrics=off --error --quiet

  plugin-audit:
    # supply chain ของ plugin แยก audit **ทีละ category** เพื่อให้ตอบได้ว่า CVE
    # ตัวนี้เป็นของ plugin ไหน และคำตอบคือ "ถอดตัวนั้นออกก่อน" ได้จริงไหม
    # (ADR 0025) — CVE ของของที่ถอดได้จึง **ไม่ทำให้ job ของ core แดง**
    # แต่ต้องดังพอให้เห็น: ล้มแล้วยิง ::warning:: + เขียนลงสรุปของ run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pipenv
      - run: pip install pipenv
      - run: pipenv sync --dev
      # ไม่ต้องติดตั้งไลบรารีของ plugin — audit จาก lock file ทีละ category
      # ชื่อ category ถามจากตัวแอปเอง **ห้าม hardcode ชื่อ plugin ใน CI**
      - name: แยก requirement ของแต่ละ category ออกมาเป็นไฟล์
        run: |
          for category in $(pipenv run flask plugin-deps --categories); do
            pipenv requirements --categories="$category" > "req-$category.txt"
          done
        env:
          SECRET_KEY: ci-only-secret-key-not-used-in-production-1234
      - name: pip-audit ทีละ category
        id: audit
        continue-on-error: true
        run: |
          shopt -s nullglob
          files=(req-*.txt)
          if [ ${#files[@]} -eq 0 ]; then
            echo "ไม่มี plugin ตัวไหนประกาศไลบรารีไว้ — ไม่มีอะไรต้อง audit"
            exit 0
          fi
          status=0
          for file in "${files[@]}"; do
            category="${file#req-}"
            echo "== ${category%.txt}"
            # `|| status=$?` ไม่ใช่ `if ! cmd; then status=$?` — ในกิ่งนั้น $? เป็น 0 เสมอ
            # (กติกาเดียวกับ scripts/purge_cron.sh) และต้อง audit ให้ครบทุก category
            # ไม่ใช่หยุดที่ตัวแรกที่มี CVE
            pipenv run pip-audit --no-deps -r "$file" || status=$?
          done
          exit $status
      - name: รายงานว่ามี CVE ค้างอยู่ในไลบรารีของ plugin
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::warning title=CVE ในไลบรารีของ plugin::ดู log ของ job นี้ว่าเป็น category ไหน — ถอด plugin ตัวนั้นด้วย DISABLED_PLUGINS ได้ทันทีโดยไม่ต้อง deploy (ADR 0025)"
          {
            echo "### มี CVE ในไลบรารีของ plugin"
            echo
            echo "core ไม่แดงเพราะไลบรารีพวกนี้ **ถอดได้** — แต่ต้องมีคนตัดสินใจ"
            echo "ว่าจะถอด (\`DISABLED_PLUGINS\`) หรืออัปเกรด ดู log ของ job นี้"
          } >> "$GITHUB_STEP_SUMMARY"

  a11y:
    # WCAG 2.2 AA ด้วย browser จริง — ครอบสิ่งที่ tests/test_a11y.py ตรวจไม่ได้
    # (contrast หลัง CSS ทำงาน, ชื่อที่ AT คำนวณได้จริง) สแกนทั้งโหมดมืด ธีม ocean
    # และภาษาไทย เพราะ contrast/ความยาวข้อความต่างกันตามนั้น
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pipenv
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install pipenv
      - run: pipenv sync --dev
      # ไลบรารีของ plugin อยู่นอก `[packages]` (ADR 0025) ต้องติดตั้งแยก —
      # ถามชื่อ category จากตัวแอปเอง **ห้าม hardcode ชื่อ plugin ใน CI**
      - name: ติดตั้ง category ของ plugin ทุกตัวที่ประกาศไว้
        run: pipenv sync --categories="$(pipenv run flask plugin-deps --categories)"
        env:
          SECRET_KEY: ci-only-secret-key-not-used-in-production-1234
      # pin ไว้ให้ผลซ้ำได้ — pa11y ขยับ rule เมื่อไหร่ gate จะไม่ขยับตามเงียบ ๆ
      - run: npm install --no-save pa11y-ci@4.1.1
      - name: เตรียมฐานข้อมูลชั่วคราว + ข้อมูลตัวอย่าง
        run: |
          pipenv run flask db upgrade
          # ตารางของ plugin ไม่ได้อยู่ในสาย migration ของ core (ADR 0023)
          # ต้องติดตั้งแยกเหมือนตอน deploy จริง ไม่งั้นหน้า settings จะไม่มี
          # ส่วนของการยืนยันสองขั้นให้สแกน
          pipenv run flask plugin-install auth/totp
          PYTHONPATH=. pipenv run python scripts/a11y_fixture.py
        env:
          SECRET_KEY: ci-only-secret-key-not-used-in-production-1234
          DATABASE_URL: sqlite:////tmp/a11y.db
      - name: รันแอปแล้วสแกน
        run: |
          pipenv run flask run --port 5099 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:5099/login && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:5099/login || { echo "แอปไม่ขึ้น"; exit 1; }
          ./node_modules/.bin/pa11y-ci --config .pa11yci.json
        # ไม่ต้องปิด rate limit: pa11y login ใหม่ทุก URL ก็จริง แต่ `deduct_when`
        # หักโควตาเฉพาะตอนได้ 401 — login ที่ถูกต้องไม่กินโควตาเลย
        env:
          SECRET_KEY: ci-only-secret-key-not-used-in-production-1234
          DATABASE_URL: sqlite:////tmp/a11y.db

  image:
    # **build image จริงแล้วยิงใส่มัน** — Dockerfile ที่ไม่มีใครเคย build คือไฟล์
    # ข้อความธรรมดา และ image ที่ build ผ่านแต่ไม่เคยถูกรัน ก็บอกได้แค่ว่า syntax ถูก
    # (P5-09 · เครื่อง dev ไม่มี container runtime — CI จึงเป็นที่พิสูจน์)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build
        run: docker build -t todolist:ci .
      - name: ต้องไม่รันเป็น root
        run: |
          who=$(docker run --rm todolist:ci id -un)
          echo "รันในนามของ: $who"
          [ "$who" = "todolist" ] || { echo "image รันเป็น $who ไม่ใช่ todolist"; exit 1; }
      - name: โค้ดใน image ต้องเขียนทับไม่ได้
        run: |
          # process ที่ถูกยึดต้องแก้โค้ดของตัวเองไม่ได้ — ถ้าเขียนได้แปลว่า
          # `chmod a-w` ใน Dockerfile หลุดไปโดยไม่มีอะไรฟ้อง
          if docker run --rm todolist:ci sh -c 'echo x > /app/run.py' 2>/dev/null; then
            echo "เขียนทับโค้ดใน image ได้ — ไม่ควรเป็นแบบนั้น"
            exit 1
          fi
      - name: ของที่ไม่ควรอยู่ใน image ต้องไม่อยู่
        run: |
          # .dockerignore เป็นด่านเดียวที่กัน .env กับ instance/ ไม่ให้หลุดเข้า layer
          # ลบทีหลังไม่ช่วย เพราะขุดออกมาจาก layer เก่าได้เสมอ
          for path in /app/tests /app/docs /app/.env /app/instance; do
            if docker run --rm todolist:ci sh -c "test -e $path"; then
              echo "เจอ $path ใน image"
              exit 1
            fi
          done
      - name: start จริงแล้วต้องตอบ 200
        run: |
          docker run -d --name probe -p 8000:8000 \
            -e SECRET_KEY=ci-only-secret-key-not-used-in-production-1234 \
            -e DATABASE_URL=sqlite:////tmp/ci.db \
            todolist:ci
          # รอ healthcheck ของ image เอง ไม่ใช่ sleep แบบเดา
          for _ in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Health.Status}}' probe)
            [ "$state" = "healthy" ] && break
            [ "$state" = "unhealthy" ] && { docker logs probe; exit 1; }
            sleep 2
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' probe)" = "healthy" ] || {
            echo "ไม่ healthy ภายในเวลาที่รอ"; docker logs probe; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/login)
          echo "GET /login → $code"
          [ "$code" = "200" ] || { docker logs probe; exit 1; }
      - name: log ของแอปต้องออก stderr ไม่ใช่ stdout
        run: |
          # กติกาเดียวกับที่ commit e5d3e57 ตั้งไว้ — ในคอนเทนเนอร์ก็ต้องจริง
          # (`--access-logfile -` ของ gunicorn ออก stdout ส่วน log ของแอปออก stderr)
          docker logs probe 2>/dev/null | grep -q '"logger": "app"' && {
            echo "log ของแอปโผล่ใน stdout"; exit 1; }
          docker logs probe 2>&1 1>/dev/null | grep -q '"logger"' || {
            echo "ไม่เจอ log ของแอปใน stderr"; exit 1; }
          echo "log อยู่ถูกช่อง"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pipenv
      - run: pip install pipenv
      - run: pipenv sync --dev
      # แยกเป็นไฟล์ละ category ด้วยเหตุผลเดียวกับ pip-audit: SBOM ที่รวมทุกอย่าง
      # เป็นก้อนเดียวตอบไม่ได้ว่า "ถอด plugin ตัวนี้แล้ว component ไหนหายไปบ้าง"
      # ซึ่งเป็นคำถามแรกของวันที่ CVE ออก (ADR 0025)
      - run: pipenv run cyclonedx-py environment -o sbom-core.json
      - name: SBOM ของแต่ละ category ของ plugin
        run: |
          for category in $(pipenv run flask plugin-deps --categories); do
            pipenv requirements --categories="$category" > "req-$category.txt"
            pipenv run cyclonedx-py requirements "req-$category.txt" -o "sbom-$category.json"
          done
        env:
          SECRET_KEY: ci-only-secret-key-not-used-in-production-1234
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom-*.json
