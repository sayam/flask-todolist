# bench: บังคับให้แหล่ง file เป็นทางเดียวของ SECRET_KEY
#
# **env ถูกตั้งว่างโดยตั้งใจ** — สั้นเกินนโยบาย (≥32) แอปจึง start ได้ก็ต่อเมื่อ
# อ่านจากไฟล์จริง · นี่คือตัวคุมสองทิศของ bench: มีไฟล์ = start · ไฟล์หาย = พัง
# **ชื่อไฟล์ต้องเป็นตัวพิมพ์เล็ก** (`secretdir/secret_key`) ตามกติกาของแหล่ง file
services:
  app:
    environment:
      SECRETS_URL: file:///secrets
      SECRET_KEY: ""
    volumes:
      - ./secretdir:/secrets:ro
