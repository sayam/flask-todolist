# ปลายทางของ log + กฎแจ้งเตือน (Phase 7 · P7-10 — ดู ADR 0037)
#
#   docker compose -f compose.yaml -f compose.mysql.yaml -f compose.siem.yaml up -d
#
# **log ของแอปออก stdout เหมือนเดิม ไม่มีอะไรในแอปเปลี่ยน** — ตัวเก็บอ่านจาก
# ไฟล์ log ของ docker เอง แอปจึงไม่รู้จักปลายทางนี้เลยและถอดทิ้งได้โดยไม่ต้องแก้โค้ด
# (หลักเดียวกับที่ ROPA.md ข้อ 3 เขียนไว้ว่าปลายทางเดียวของแอปคือ stdout)

services:
  # ที่เก็บ log ที่ค้นได้ + **ruler ที่ประเมินกฎแจ้งเตือนเอง**
  # ใช้ ruler ของ Loki ไม่ใช่ alert ของ Grafana เพราะสถานะของกฎถามผ่าน API ได้ตรง ๆ
  # ด่านใน CI จึงถามว่า "กฎนี้ firing หรือยัง" ได้โดยไม่ต้องคลิกอะไรบนหน้าจอ
  loki:
    image: grafana/loki:3.5.0@sha256:4c431d2e6b9b38718694b31c5d56be7c80dc69c513215fde1aeb5b02cd4e2665
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./deploy/loki.yaml:/etc/loki/loki.yaml:ro
      - ./deploy/loki-rules.yaml:/etc/loki/rules/fake/rules.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready | grep -q ready"]
      interval: 5s
      timeout: 3s
      retries: 40

  # ตัวเก็บ log — อ่านไฟล์ที่ docker เขียนไว้ให้ container ทุกตัว
  # **ต่อ docker.sock แบบอ่านอย่างเดียว** เพื่อรู้ว่าไฟล์ไหนของ service ไหน
  # (ไม่มีมันจะได้ log ที่ไม่มี label บอกว่ามาจากใคร ซึ่งค้นตอนเกิดเหตุไม่ได้)
  logs:
    image: grafana/alloy:v1.10.0@sha256:1bc130e909116a4bf950eb5187a346007d3b796f96832b529acb14a64e41230f
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./deploy/alloy.river:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_healthy

  # หน้าจอสำหรับคน — ไม่ใช่ตัวที่ CI ใช้ตัดสิน
  grafana:
    image: grafana/grafana:12.0.2@sha256:b5b59bfc7561634c2d7b136c4543d702ebcc94a3da477f21ff26f89ffd4214fa
    environment:
      # **ค่านี้มีผลเฉพาะตอน start ครั้งแรก** — Grafana เก็บรหัสไว้ใน volume ของมัน
      # เปลี่ยนตัวแปรแล้ว restart จึงไม่เปลี่ยนอะไร (เสียเวลาไปแล้วหนึ่งรอบตอนทำ)
      # จะเปลี่ยนจริงต้องเปลี่ยนในหน้าเว็บของมัน หรือลบ volume ทิ้งแล้วขึ้นใหม่
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?ต้องตั้ง GRAFANA_PASSWORD ก่อน}
      # ไม่มีใครสมัครเองได้ และคนที่ไม่ได้ login ดูอะไรไม่ได้เลย
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/grafana-datasource.yaml:/etc/grafana/provisioning/datasources/loki.yaml:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy

volumes:
  loki-data:
  alloy-data:
  grafana-data:
