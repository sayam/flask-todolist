# override: เพิ่ม IdP สำหรับทดสอบ SSO (P5-10 เตรียมไว้ให้ P5-13)
#   docker compose -f compose.yaml -f compose.sso.yaml up
#   (ต่อกับยี่ห้ออื่นได้ด้วย: -f compose.yaml -f compose.mysql.yaml -f compose.sso.yaml)
#
# **แยกไฟล์เพราะยังไม่มีใครใช้** — ADR 0018/0024 วาง seam ของ auth ไว้แล้วแต่
# ตัว OIDC เป็นงานของ P5-13 การใส่ Keycloak ลง stack หลักตั้งแต่ตอนนี้แปลว่า
# ทุกคนที่แค่อยากรันแอปต้องจ่ายค่า RAM ให้ IdP ที่ไม่มีอะไรต่อกับมัน
#
# **DoD ของ P5-13 คือ login กับ IdP ตัวนี้ได้จริง** ไม่ใช่ mock — เหตุผลที่ SSO
# ถูกเลื่อนจาก Phase 4 มาที่นี่ก็เพราะต้องมี stack นี้ก่อน (ดู ROADMAP)

services:
  app:
    environment:
      # **ชื่อโฮสต์ต้องเป็นตัวเดียวกันทั้งจากในและนอก stack** — `issuer` เป็นสตริง
      # ที่ถูกเทียบตรง ๆ กับ `iss` ใน ID token (ADR 0028) ถ้า browser ไปที่
      # `127.0.0.1:8080` แต่แอปคุยกับ `keycloak:8080` จะได้ token ที่ `iss`
      # ไม่ตรงกับที่เราคาดตลอดกาล · ฝั่ง browser แก้ด้วย `--resolve` ไม่ใช่
      # แก้ที่นี่ (ดู job `stack` ใน CI)
      # **redirect_uri ประกอบจากค่านี้ ไม่ใช่จาก header `Host` ของคำขอ**
      # ซึ่งคนยิงตั้งเองได้ (semgrep: flask-url-for-external-true) — ค่านี้ต้อง
      # ตรงกับที่ลงทะเบียนไว้ใน realm ของ IdP เป๊ะ ๆ อยู่แล้ว จึงไม่มีอะไรให้เดา
      EXTERNAL_URL: http://127.0.0.1:8000
      OIDC_ISSUER: http://keycloak:8080/realms/todolist
      OIDC_CLIENT_ID: todolist
      OIDC_CLIENT_SECRET: ci-only-client-secret-not-a-real-one
      # IdP ทดสอบพูด http — **ต้องเปิดข้อนี้อย่างชัดเจน** ไม่งั้นแอปปฏิเสธเอง
      # และแอปจะเตือนทุกครั้งที่ถูกใช้ เพราะมันทำให้ ADR 0028 ข้อ 4 ตกทั้งข้อ
      OIDC_INSECURE_ISSUER: "1"
      # กลุ่มใน realm ที่แปลว่า admin ที่นี่ (ADR 0028 ข้อ 5)
      OIDC_ADMIN_GROUP: todolist-admins
    depends_on:
      keycloak:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    # `start-dev` ใช้ฐานข้อมูลในตัวและปิด https — **สำหรับ dev เท่านั้น**
    # prod ต้องใช้ `start` พร้อมฐานข้อมูลจริงและ TLS (จะแตะตอน P5-12)
    # `--import-realm` อ่านไฟล์ใน /opt/keycloak/data/import ตอน start
    command: ["start-dev", "--http-port=8080", "--import-realm"]
    volumes:
      # **realm ของการทดสอบ ห้ามใช้กับ IdP จริง** — ทั้ง client secret และ
      # รหัสผ่านในไฟล์นั้นเป็นค่าสาธารณะโดยตั้งใจ และ `sslRequired` เป็น `none`
      # เพราะ IdP ตัวนี้พูด http (คู่กับ `OIDC_INSECURE_ISSUER=1` ข้างบน)
      #
      # **ไฟล์นั้นห้ามมีคอมเมนต์** — Keycloak ปฏิเสธคีย์ที่ไม่รู้จักแล้ว *ไม่ start*
      # (`Unrecognized field "_comment"`) คำอธิบายจึงต้องอยู่ที่นี่แทน สิ่งที่
      # realm นั้นประกาศไว้: client `todolist` แบบ confidential ที่เปิดเฉพาะ
      # standard (code) flow ตามข้อจำกัดของ ADR 0028 · กลุ่ม `todolist-admins`
      # พร้อม mapper ที่ส่ง claim `groups` แบบชื่อเปล่า ๆ (ไม่ใช่ path เต็ม) ·
      # ผู้ใช้ `somchai` ที่อยู่ในกลุ่มนั้น
      - ./deploy/keycloak-realm.json:/opt/keycloak/data/import/todolist-realm.json:ro
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?ต้องตั้ง KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    healthcheck:
      # image ของ Keycloak ไม่มี curl/wget — ใช้ /dev/tcp ของ bash ที่มีอยู่ในตัว
      # (เจอตอนทดสอบจริง: `curl: not found` ทำให้ healthcheck ไม่ผ่านทั้งที่ตัวมันขึ้นแล้ว)
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
