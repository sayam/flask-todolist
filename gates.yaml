      within_days: 14
      how: >-
        `scripts/schedule_census.py` รันทุก push บน main และทุกครั้งที่กฎของ branch
        เปลี่ยน · เกณฑ์คือรอบที่ประกาศ × 2 ซึ่งสำหรับ cron รายสัปดาห์คือ 14 วัน ·
        มีแถวทวงตามรอบใน `docs/SECURITY-CADENCE.md` สำหรับส่วนที่เครื่องตรวจไม่ได้
        (Dependabot ซึ่งไม่มี endpoint สาธารณะให้ถาม)
    standard: []
    requires: [github-actions]
    portable: true
    layer: baseline
    pillar: manageability
    born_from: >-
      audit รอบ 10 ข้อ 2 — ADR 0064 ปิดชั้น "workflow ที่ไม่ได้ start = 0 job"
      ไปแล้ว แต่ชั้นถัดขึ้นไปยังเปิด: **workflow ที่ไม่เคยถูกทริกเกอร์ = 0 run**
      ซึ่งหน้าตาเหมือน "ไม่มี run ไหนแดง" เป๊ะในทุกเครื่องมือที่มี · cron ของ
      `scorecard.yml` ยิงจริงมาแล้วครั้งเดียวตลอดอายุ repo และถ้ามันหยุดวันนี้
      ไม่มีเทสต์ job หรือแถว cadence ไหนรู้เลย · GitHub ยังปิด schedule
      อัตโนมัติให้ repo ที่เงียบเกิน 60 วันด้วย ซึ่งเป็นความเงียบที่มาจากข้างนอก
    proved_by:
      - kind: mutation
        ref: pr/109
        date: 2026-08-18
        caught: >-
          พังสี่ทิศแล้วแดงครบบนข้อมูลรูปเดียวกับที่ API คืนมาจริง — ไม่เคยมี run
          ชนิด schedule เลย (`null`) · run ล่าสุดเก่า 48 วันสำหรับ cron รายสัปดาห์ ·
          เกณฑ์ที่แคบลงเหลือ 1 เท่าต้องจับ run ที่ 10 วันได้ · และรอบของ cron
          ต้องอ่านจากช่องที่หยาบที่สุดที่ถูกตรึง ไม่ใช่เดาจากชื่อ workflow
          · ทิศ "ผ่านเมื่อควรผ่าน" ยืนยันกับของจริง: cron ที่ยิงเมื่อวานต้องเงียบ

