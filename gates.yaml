  - id: purge-timer-real-systemd
    title: งานลบข้อมูลพ้นระยะติดตั้งบน scheduler จริง (ที่นี่ systemd) และความล้มเหลวมองเห็นได้
    kind: job
    severity: blocking
    enforced_by: {job: purge-timer}
    standard: []
    requires: [systemd]
    portable: true
    layer: baseline
    pillar: security
    born_from: >-
      ระยะเก็บรักษาจะเป็นจริงก็ต่อเมื่อมีอะไรรัน purge ตามรอบ — และงานตามรอบ
      ที่เงียบตอนพังแย่กว่าไม่มีเลย · `$?` ในกิ่ง if! เป็น 0 เสมอ ·
      audit รอบ 10 ข้อ 4 ต่ออีกชั้น: คำว่า "มองเห็นได้" ของ gate นี้เคยครอบแค่
      **exit code ที่สคริปต์คืนให้ systemd** ส่วนสิ่งที่เกิดหลังจากนั้นคือสถานะที่
      ต้องมีคนเดินไปถาม — หน่วยจึงต้องมี OnFailure ที่ทิ้งบรรทัดซึ่งค้นเจอด้วย
      เครื่อง และ job ต้องตรวจว่ามันยังชี้อยู่และหน่วยปลายทางถูกติดตั้งมาด้วย
    proved_by:
      - kind: mutation
        ref: pr/107
        date: 2026-08-18
        caught: >-
          พังสามทิศบนสำเนาของหน่วยที่ส่งมอบจริง แล้วแดงครบ — ถอด OnFailure ออกจาก
          หน่วยหลัก · ติดตั้งหน่วยหลักโดยไม่วางหน่วยปลายทาง (systemd หาไม่เจอตอน
          งานล้ม แล้วเงียบเท่าเดิมทั้งที่ไฟล์อ่านแล้วดูเหมือนมีตัวรับ) · ถอดคำ
