        แถวทบทวนผู้เฝ้าใน `docs/SECURITY-CADENCE.md` · ตัวมันเองวัดตัวเอง
        ด้วย (gate นี้อยู่ในไฟล์ workflow เดียวกับที่มันวัด) ซึ่งเป็นคุณสมบัติ
        ที่ตั้งใจ: คำสัญญาที่ยกเว้นตัวเองคือคำสัญญาที่ไม่มีใครตรวจ
    standard: []
    requires: [github-actions]
    portable: true
    layer: baseline
    pillar: manageability
    born_from: >-
