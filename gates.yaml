# ดัชนี gate ของ repo นี้ — ADR 0039
#
# **ไฟล์นี้เป็นดัชนี ไม่ใช่แหล่ง** — ตัวบังคับจริงคือเทสต์กับ job ใน CI
# `tests/test_gates.py` บังคับว่าดัชนีกับความจริงตรงกันสองทิศ:
#   - ทุก gate ชี้ไปหา job/step/ไฟล์เทสต์ที่มีจริง
#   - ทุก job ต้องมี gate · ไฟล์เทสต์**ทุกไฟล์**ต้องถูกตัดสินว่าเป็นของ gate
#     ตัวไหนตัวเดียว (partition — แบบแผนเดียวกับ DATA-CLASSIFICATION)
#
# เพิ่มไฟล์เทสต์ใหม่ = มาลงทะเบียนที่นี่ (gate ใหม่ หรือแถวใน app-behavior-suite)
# เพิ่ม job ใหม่ = ต้องมี gate — ไม่งั้น tests/test_gates.py แดงพร้อมบอกว่าขาดอะไร
#
# `proved_by:` = หลักฐานว่าด่านนี้ **เคยแดงตอนที่ของเสียจริง** (ADR 0059) —
# `kind: ci-red` (แดงเองใน CI · `ref: run/<id>`) หรือ `kind: mutation`
# (แดงตอนพังโค้ดโดยตั้งใจตอนเขียนด่าน · `ref: pr/<number>`) · `caught:` บอกว่า
# มันจับอะไรได้ · gate ที่ยังไม่มีหลักฐานต้องอยู่ในรายการ `UNPROVEN` ของ
# `tests/test_gate_evidence.py` ซึ่งหดได้ทางเดียว — gate ใหม่ต้องมาพร้อมหลักฐาน
#
# `portable: true` = กฎที่ export ได้ และต้องมี `born_from` (กับดักที่ให้กำเนิดกฎ)
# `layer:` = ชั้นของกฎ (ADR 0042): `baseline` (สากล → SKILL.md · ต้อง portable)
# · `business` (ข้อตกลงของตัวแอป → SKILL-TODOLIST.md ถ้า portable)
# · `internal` (ของ repo นี้เอง · ห้าม portable)
# `standard` อ้างข้อ ASVS ได้เฉพาะแถวที่ประเมินว่า "ผ่าน"

version: 1
gates:
  # ---------------------------------------------------------------- ดัชนีเอง
  - id: gates-registry-total
    title: ดัชนี gate ตรงกับความจริงสองทิศ และไฟล์เทสต์ทุกไฟล์ถูกตัดสิน
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_gates.py]}
    standard: []
    requires: []
    portable: true
    layer: baseline
    pillar: devx
    born_from: >-
      semgrep เคยตรวจแค่ 71/136 ไฟล์เพราะขอบเขตประกาศสองที่ —
      ดัชนีที่ไม่ถูกบังคับให้ตรงกับความจริงคือดัชนีที่โกหกเงียบ ๆ · audit รอบ 7
      ต่ออีกฟิลด์ (`guards:` — ADR 0062): ด่านที่แพงและยังไม่เคยจับอะไรต้องบอกได้
      ว่ามันคุ้ม*เส้นทางไหน* ไม่งั้นคำถาม "ยังคุ้มไหม" ตอบด้วยความรู้สึกเสมอ
    proved_by:
      - kind: mutation
        ref: pr/95
        date: 2026-08-17
        caught: >-
          พังสองทิศแล้วแดงครบ — ถอด `guards` ออกจาก gate ที่รายการบังคับให้มี ·
          ให้ `guards` ชี้เส้นทางที่ไม่มีอยู่จริง (เส้นทางผีทำให้ตัวทบทวนอ่านว่า
          "ไม่มีใครแตะเลย" ตลอดกาล)

  - id: gates-carry-red-evidence
    title: gate ใหม่ต้องมาพร้อมหลักฐานว่าเคยแดงตอนของเสียจริง — รายการที่ยังไม่มีหดได้ทางเดียว
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_gate_evidence.py]}
    standard: []
    requires: []
    portable: true
    layer: baseline
    pillar: devx
    born_from: >-
      audit governance รอบ 6 (2026-08-17) — วัดจาก 200 run ล่าสุดแล้วพบว่า
      **21 job ไม่เคยแดงเลย** ซึ่งแยกไม่ออกจากภายนอกว่า "ของดีจริงจึงไม่แดง"
      หรือ "ด่านไม่ได้ตรวจอะไร" · ด่านที่ไม่มีใครเคยเห็นแดงคือด่านที่ยังไม่มี
      ใครพิสูจน์ว่ามันตรวจอะไร — เก็บหลักฐานตอนที่มันเกิด ไม่ใช่ตอนที่ต้องใช้
    proved_by:
      - kind: mutation
        ref: pr/89
        date: 2026-08-17
        caught: >-
          พังห้าทิศแล้วแดงครบ — ใส่ gate ใหม่ที่ไม่มี proved_by · สลับชื่อใน
          UNPROVEN เป็นชื่อผี · ใส่ ref ที่ผิดรูปของ kind นั้น · ทิ้ง gate ที่
          พิสูจน์แล้วไว้ใน UNPROVEN ต่อ · ขยับเพดาน ratchet ขึ้น
          (สองทิศกลางต้องพังแบบคงจำนวนไว้ ไม่งั้น ratchet แดงบังตัวที่ทดสอบอยู่)

  - id: skill-mirrors-portable-gates
