      กี่วัน แต่สิ่งเดียวที่ตรวจคือ *รูปแบบ* (เป็นเลข · ไม่เกิน 90) · วัดจริงบน
      หน้าต่างเดียวกัน 4 วัน: ความแดงที่บล็อกใครยืนอยู่ 0.4 ชม. ส่วนที่ไม่บล็อกใคร
      ยืนอยู่ 14.6 ชม. — ต่างกัน 36 เท่า และไม่มีอะไรเทียบตัวเลขนั้นกับที่สัญญาไว้
    proved_by:
      - kind: mutation
        ref: pr/113
        date: 2026-08-18
        caught: >-
          พังสี่ทิศแล้วแดงครบ — รวมสถิติด้วย `name` แทน `path` (ซึ่งเป็นความผิดพลาด
          ที่ฉบับแรกของการวัดนี้ทำจริง: ได้ 2.2 ชม. แทน 14.6) · ไม่นับช่วงที่ยัง
