          บล็อกได้กลับเข้ามาเทียบด้วย ซึ่งจะให้ "เขียวที่ไม่ได้แปลว่าอะไร"

  - id: schedules-still-fire
    title: ตารางเวลาที่ประกาศไว้ต้องพิสูจน์ได้ว่ายังยิงอยู่ — "ไม่มี run เลย" ต้องไม่เงียบเท่า "ไม่มี run ไหนแดง"
    kind: step
    # บล็อกไม่ได้ — อยู่ใน job `posture` ซึ่งไม่รันบน pull request (ADR 0066)
    severity: watched
    enforced_by: {job: posture, step: ตารางเวลาที่ประกาศไว้ต้องยังยิงอยู่จริง}
