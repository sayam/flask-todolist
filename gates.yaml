  - id: jobs-declare-a-time-budget
    title: ทุก job และทุกคำสั่งที่เครื่องมือของเรายิงออกไป ประกาศเพดานเวลา — "ค้าง" กับ "ช้า" ต้องแยกออกจากกันได้
    kind: test
    severity: blocking
    enforced_by: {job: test, tests: [tests/test_job_timeouts.py]}
    standard: []
    requires: [github-actions]
    portable: true
    layer: baseline
    pillar: manageability
    born_from: >-
      audit รอบ 11 — ไม่มี job ไหนตั้ง `timeout-minutes` เลย (0 จาก 28) เพดานจึงเป็น
      ค่าเริ่มต้น 6 ชั่วโมงของ GitHub ซึ่งไม่ใช่เพดานที่ใครเลือก · ราคาที่จ่ายคือ
      ความสามารถในการตัดสินใจ ไม่ใช่เวลาเครื่อง: job ที่ค้างจริงกับ job ที่แค่ช้ากว่า
      ปกติให้สัญญาณเหมือนกันทุกอย่าง · เกิดขึ้นแล้วจริงวันเดียวกัน — `dialect (mysql-8)`
      ถูกยกเลิกทิ้งทั้งที่เดินอยู่ที่ 92% เพราะผู้ตรวจแยกสองอย่างนี้ไม่ออก ·
      ต่อมาในรอบเดียวกันขยายไปถึง `subprocess.run` ของ checker ทั้ง 11 จุด ซึ่ง
      ไม่มี `timeout=` เลย — เพดานของ job จะถูกกินทั้งก้อนโดยคำสั่งเดียวที่ไม่ตอบ
      แล้วรายงานว่า "job หมดเวลา" ซึ่งชี้ผิดที่
    proved_by:
      - kind: mutation
        ref: pr/110
        date: 2026-08-18
        caught: >-
