<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">Todolist</title>
  <rect x="4" y="4" width="112" height="112" rx="26" fill="#0f766e"/>

  <!-- แถวที่ 1: ทำเสร็จแล้ว — ติ๊กถูกและมีเส้นขีดฆ่า -->
