  <path d="M31.5 40.3 l3.2 3.3 l6.2 -6.6" fill="none" stroke="#0f766e"
        stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="54" y="36.5" width="40" height="7" rx="3.5" fill="#ffffff" opacity="0.32"/>
  <rect x="51" y="38.9" width="46" height="2.4" rx="1.2" fill="#ffffff"/>

  <!-- แถวที่ 2 และ 3: ยังไม่เสร็จ -->
  <circle cx="36" cy="66" r="10" fill="none" stroke="#ffffff" stroke-width="3.4"/>
  <rect x="54" y="62.5" width="46" height="7" rx="3.5" fill="#ffffff"/>

  <circle cx="36" cy="92" r="10" fill="none" stroke="#ffffff" stroke-width="3.4"/>
  <rect x="54" y="88.5" width="30" height="7" rx="3.5" fill="#ffffff" opacity="0.78"/>
