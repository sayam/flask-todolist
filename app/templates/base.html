<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Todolist{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo-small.svg') }}">
</head>
<body>
  {% if current_user.is_authenticated %}
  <header>
    <a href="{{ url_for('main.index') }}" style="text-decoration:none; color:inherit">
      <img src="{{ url_for('static', filename='logo-small.svg') }}" alt="" width="28" height="28"
           style="vertical-align:middle">
      <strong style="vertical-align:middle; font-size:1.3em">Todolist</strong>
    </a>
  </header>
  <nav>
    <a href="{{ url_for('main.index') }}">งาน</a> |
    <a href="{{ url_for('main.categories') }}">หมวดงาน</a> |
    <span>{{ current_user.username }}</span>
    <form action="{{ url_for('auth.logout') }}" method="post" style="display:inline">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit">ออกจากระบบ</button>
    </form>
  </nav>
  <hr>
  {% endif %}

  {% with messages = get_flashed_messages() %}
    {% if messages %}
    <ul>
      {% for message in messages %}
      <li><strong>{{ message }}</strong></li>
      {% endfor %}
    </ul>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}
</body>
</html>
