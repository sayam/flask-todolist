<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>Todolist</title>
</head>
<body>
  <h1>Todolist</h1>
  <form action="{{ url_for('main.add') }}" method="post">
    <input type="text" name="title" placeholder="งานใหม่" required>
    <button type="submit">เพิ่ม</button>
  </form>
  <ul>
    {% for todo in todos %}
    <li>
      <form action="{{ url_for('main.toggle', todo_id=todo.id) }}" method="post" style="display:inline">
        <input type="checkbox" onchange="this.form.submit()" {{ 'checked' if todo.done else '' }}>
      </form>
      <span style="{{ 'text-decoration: line-through;' if todo.done else '' }}">{{ todo.title }}</span>
      <form action="{{ url_for('main.delete', todo_id=todo.id) }}" method="post" style="display:inline">
        <button type="submit">ลบ</button>
      </form>
    </li>
    {% else %}
    <li>ยังไม่มีงาน</li>
    {% endfor %}
  </ul>
</body>
</html>
