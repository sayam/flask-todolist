# จุดที่คำขอถูกส่งต่อไปหา app — **ใช้ร่วมกันทั้งขา http และขา TLS**
# (`include` จาก deploy/nginx.conf และ deploy/nginx-tls.conf)
#
# แยกไฟล์เพราะกฎที่ต้องถูกต้องที่สุดในนี้ (การ resolve ชื่อ `app` ใหม่ทุกครั้ง)
# ถ้าอยู่สองที่ วันหนึ่งจะมีคนแก้ที่เดียว แล้วขาที่เหลือกลับไปยิง replica ตัวเดียว
# โดยไม่มีอะไรฟ้อง

# **DNS ของ docker ต้องถูกถามใหม่ทุกครั้ง** — 127.0.0.11 คือ resolver ในตัวของ
# docker ซึ่งคืน A record ครบทุก replica ของชื่อ `app`
resolver 127.0.0.11 valid=10s ipv6=off;

location / {
    # **ต้องผ่านตัวแปร ไม่ใช่เขียน host ลง proxy_pass ตรง ๆ**
    # nginx resolve ชื่อใน `proxy_pass` แบบคงที่ **ครั้งเดียวตอนโหลด config**
    # แล้วจำไอพีนั้นไว้ตลอดชีวิตของ process ผลคือ scale ขึ้นเป็น 2 replica
    # แล้ว **ทุกคำขอยังวิ่งไปตัวเดิมตัวเดียว** โดยไม่มี error อะไรให้เห็น
    # (กราฟดูเหมือน "โหลดไม่สมดุล" ทั้งที่จริงคือ replica ที่สองไม่เคยถูกใช้)
    set $upstream http://app:8000;
    proxy_pass $upstream;

    # **`$http_host` ไม่ใช่ `$host`** — `$host` ตัดพอร์ตทิ้ง แอปจึงคิดว่าตัวเอง
    # อยู่ที่ `https://ชื่อโฮสต์/` เฉย ๆ ผลที่ตามมาคือ Flask-WTF ปฏิเสธทุก POST
    # ด้วย 400 ตอนรันบน https (มันเทียบ Referer กับ url_root ของคำขอ ซึ่งไม่ตรงกัน
    # เมื่อพอร์ตหายไป) และ `url_for(_external=True)` ก็จะคืน URL ที่เข้าไม่ถึง
    # — เจอจริงตอนเปิด TLS ครั้งแรก (P5-12) ขา http ไม่เคยแสดงอาการนี้เพราะ
    # การตรวจ Referer ของ Flask-WTF ทำงานเฉพาะคำขอที่เป็น https
    proxy_set_header Host $http_host;
    # **ต่อท้ายค่าที่มีอยู่ ไม่ใช่ทับ** — ค่าที่ client แนบมาเองจะอยู่ซ้ายสุด
    # และแอปอ่านค่าที่ N จากขวาตาม TRUSTED_PROXY_HOPS (ADR 0027)
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # **ตัวนี้คือสิ่งที่ทำให้ HTTPS_ENABLED ไม่ redirect วน** — Talisman ตัดสินจาก
    # `request.scheme` ซึ่งจะเป็น http เสมอถ้าไม่บอก เพราะ TLS จบที่ nginx
    proxy_set_header X-Forwarded-Proto $scheme;
}
