# reverse proxy หน้า app หลายตัว — ขา http ล้วน (Phase 5 · P5-11)
#
# **มีไว้เพราะ replica ตัวที่สองต้องมีคนกระจายให้** ไม่ใช่เพื่อความเร็ว
# ตัวที่จบ TLS อยู่ใน deploy/nginx-tls.conf (P5-12) ซึ่งใช้ location เดียวกันกับที่นี่

events {}

http {
    # log ออกทางเดียวกับที่ runtime เก็บ ไม่ใช่ไฟล์ในตัว container ที่ไม่มีใครอ่าน
    access_log /dev/stdout;
    error_log /dev/stderr;

    server {
        listen 8080;
        include /etc/nginx/todolist-location.conf;
    }
}
