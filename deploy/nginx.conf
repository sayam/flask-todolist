# reverse proxy หน้า app หลายตัว (Phase 5 · P5-11)
#
# **มีไว้เพราะ replica ตัวที่สองต้องมีคนกระจายให้** ไม่ใช่เพื่อความเร็ว —
# และเพราะ P5-12 ต้องมีที่จบ TLS ไฟล์นี้จะเป็นที่นั้น

events {}

http {
    # log ออกทางเดียวกับที่ runtime เก็บ ไม่ใช่ไฟล์ในตัว container ที่ไม่มีใครอ่าน
    access_log /dev/stdout;
    error_log /dev/stderr;

    server {
        listen 8080;

        # **DNS ของ docker ต้องถูกถามใหม่ทุกครั้ง** — 127.0.0.11 คือ resolver
        # ในตัวของ docker ซึ่งคืน A record ครบทุก replica ของชื่อ `app`
        resolver 127.0.0.11 valid=10s ipv6=off;

        location / {
            # **ต้องผ่านตัวแปร ไม่ใช่เขียน host ลง proxy_pass ตรง ๆ**
            # nginx resolve ชื่อใน `proxy_pass` แบบคงที่ **ครั้งเดียวตอนโหลด config**
            # แล้วจำไอพีนั้นไว้ตลอดชีวิตของ process ผลคือ scale ขึ้นเป็น 2 replica
            # แล้ว **ทุกคำขอยังวิ่งไปตัวเดิมตัวเดียว** โดยไม่มี error อะไรให้เห็น
            # (กราฟดูเหมือน "โหลดไม่สมดุล" ทั้งที่จริงคือ replica ที่สองไม่เคยถูกใช้)
            # เขียนผ่านตัวแปรเมื่อไหร่ nginx จะกลับไปถาม resolver ตามอายุที่ตั้งไว้
            set $upstream http://app:8000;
            proxy_pass $upstream;

            proxy_set_header Host $host;
            # **ต่อท้ายค่าที่มีอยู่ ไม่ใช่ทับ** — ค่าที่ client แนบมาเองจะอยู่ซ้ายสุด
            # และแอปอ่านค่าที่ N จากขวาตาม TRUSTED_PROXY_HOPS (ดู app/proxy.py)
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
