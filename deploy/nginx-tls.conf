# reverse proxy ที่ **จบ TLS** (Phase 5 · P5-12)
#
# ใช้แทน deploy/nginx.conf เมื่อเปิด compose.tls.yaml — location เดียวกันเป๊ะ
# (`include` ไฟล์เดียวกัน) ต่างกันแค่ทางเข้า
#
# **HSTS ไม่ได้ตั้งที่นี่** แม้ nginx จะทำได้ — เจ้าของ header ชุดความปลอดภัย
# คือ Talisman ใน `app/security_headers.py` ที่เดียว (ADR 0010) การเพิ่มที่นี่
# ด้วยจะได้ header ซ้ำสองบรรทัดที่มีค่าไม่ตรงกันได้ และวันที่ต้องแก้ค่า
# `max-age` จะมีสองที่ให้ลืม — ตอนนี้แอปส่งให้เองเมื่อ `HTTPS_ENABLED=1`
# ซึ่ง compose.tls.yaml ตั้งมาให้พร้อมกับไฟล์นี้เสมอ

events {}

http {
    access_log /dev/stdout;
    error_log /dev/stderr;

    # เหมือนขา http — ไม่บอกเวอร์ชันของ nginx (ดู deploy/nginx.conf)
    server_tokens off;

    # ขา http มีหน้าที่เดียวคือส่งต่อไป https — **ห้ามเสิร์ฟเนื้อหา**
    # เพราะพอ `HTTPS_ENABLED=1` คุกกี้ session จะมีแฟล็ก `Secure` ซึ่ง browser
    # จะไม่ส่งกลับมาทาง http เลย ผลคือหน้า login ทำงาน "ได้" แต่ login ไม่ติด
    # และไม่มี error อะไรให้เห็นทั้งสองฝั่ง
    server {
        listen 8080;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 8443 ssl;
        http2 on;

        ssl_certificate     /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;

        # **1.2 กับ 1.3 เท่านั้น** — 1.0/1.1 ถูก deprecate แล้ว (RFC 8996)
        # ค่าเริ่มต้นของ nginx บางเวอร์ชันยังเปิด 1.0/1.1 อยู่ การไม่เขียนบรรทัดนี้
        # จึงไม่ใช่ "ใช้ค่าที่ปลอดภัยตามสมัย" แต่คือปล่อยให้ image ตัดสินแทน
        ssl_protocols TLSv1.2 TLSv1.3;

        # **จำกัดไว้ที่ ECDHE เท่านั้น เพื่อให้มี perfect forward secrecy จริง**
        # TLS 1.3 มี PFS เสมอโดยนิยาม **แต่ TLS 1.2 ไม่ใช่** — ไม่เขียนบรรทัดนี้
        # แล้ว nginx ยอมรับชุดที่แลกกุญแจด้วย RSA ล้วนด้วย ซึ่งแปลว่าใครที่เก็บ
        # ทราฟฟิกไว้วันนี้ แล้ววันหนึ่งได้กุญแจส่วนตัวไป จะถอดรหัสย้อนหลังได้หมด
        #
        # **วัดจริงก่อนแก้ (nginx:1.27-alpine ตัวเดียวกับที่ compose ใช้)**:
        # การต่อรองตามปกติได้ `ECDHE-RSA-AES256-GCM-SHA384` ซึ่งดูปลอดภัยดี
        # **แต่ไคลเอนต์ที่ขอ `AES128-GCM-SHA256` มาตรง ๆ ก็ได้รับ** — ด่านที่ดูแค่
        # "ต่อรองแล้วได้อะไร" จึงรายงานว่าผ่าน ทั้งที่ทางที่ไม่มี PFS ยังเปิดอยู่
        # และคนที่จะเดินทางนั้นคือคนที่ตั้งใจเดิน ไม่ใช่เบราว์เซอร์ทั่วไป
        #
        # บรรทัดนี้ **ไม่มีผลกับ TLS 1.3** (คนละพารามิเตอร์ และทุกชุดของ 1.3 มี
        # PFS อยู่แล้ว) · ไม่ใส่ชุด DHE เพราะต้องมี `ssl_dhparam` คู่กัน ซึ่งเป็น
        # ไฟล์อีกก้อนที่ต้องดูแลและหมุน โดยที่ ECDHE ครอบไคลเอนต์ยุคนี้หมดแล้ว
        #
        # `scripts/check_tls_pfs.sh` เป็นตัวยืนยัน — มันยิง "ตัวคุม" ที่ต้องสำเร็จ
        # ก่อนเสมอ เพราะ `openssl s_client` ตอบเหมือนกันทั้งตอนถูกปฏิเสธและตอน
        # ไม่มีใครฟังพอร์ต · job `stack` ใน CI รันมันทุก push
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

        # ให้ client เลือก cipher ตามลำดับของตัวเอง — client สมัยใหม่รู้จัก
        # ฮาร์ดแวร์ของตัวเองดีกว่าเรา (คำแนะนำ Mozilla intermediate)
        # **ปลอดภัยเพราะรายการข้างบนมีแต่ชุดที่ยอมรับได้แล้ว** ไม่ใช่เพราะเชื่อ client
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:TLS:10m;
        ssl_session_tickets off;

        include /etc/nginx/todolist-location.conf;
    }
}
