# กฎที่ยิงจากการ **ไม่มี** — audit รอบ 26 ข้อ 2 (ADR 0037 โน้ต 2026-08-23)
#
# **ทำไมกฎแบบนี้ต้องอยู่ที่ Prometheus ไม่ใช่ที่ Loki**
#
# กฎทั้งสามข้อใน `deploy/loki-rules.yaml` เป็น `count_over_time(…) > n` ทั้งหมด —
# ยิงเมื่อ *มี* เหตุการณ์แย่ ๆ เข้ามา · ถ้าแอปหยุด ถ้าตัวส่ง log หยุด ถ้าดิสก์เต็ม
# หรือถ้าชื่อฟิลด์ใน log เปลี่ยนจน `| json` แยกไม่ออก ทั้งสามข้อจะประเมินได้ศูนย์
# ตลอดไปและเงียบสนิท — ซึ่งหน้าตาเหมือนระบบที่แข็งแรงเป๊ะ
#
# ทางแก้ที่ *ดูเหมือน* ตรงไปตรงมาคือเติม `absent_over_time` ฝั่ง Loki แต่มัน**ผิด
# สำหรับแอปตัวนี้**: นี่เป็น todolist ส่วนตัว/ครอบครัว (ADR 0031 — เป้าคือ 5 คำขอ
# พร้อมกัน) การไม่มี log ทั้งคืนเป็นสภาพปกติ ไม่ใช่ความล้มเหลว · กฎที่ดังทุกคืน
# จะถูกปิดเสียงภายในสองสัปดาห์ แล้วกฎที่เหลือถูกมองข้ามไปด้วย (ADR 0037 หัวไฟล์)
#
# สัญญาณที่ **ไม่ขึ้นกับว่ามีคนใช้งานหรือเปล่า** มีอยู่ที่เดียวคือฝั่งที่ *ดึง*:
# Prometheus ยิง `/metrics` ทุก 5 วินาทีไม่ว่าจะมีใครใช้แอปอยู่ไหม · `up` จึงเป็น
# สัญญาณเดียวในระบบที่ "เงียบ" กับ "ตาย" แยกออกจากกันได้จริง
#
# **และก่อนหน้านี้ Prometheus ไม่มีกฎสักข้อ** — ไม่มี `rule_files` ไม่มี `alerting`
# มันเก็บตัวเลขได้อย่างเดียว · ครึ่งที่เห็นการตายของ scrape เป็นครึ่งที่พูดไม่ได้
#
# ที่ทำให้เรื่องนี้ไม่ใช่ทฤษฎี: token ที่ `docs/OPERATIONS.md` สั่งให้ออกมี**อายุ
# 90 วันตามค่าเริ่มต้น** (`app/services/tokens.py::DEFAULT_EXPIRY_DAYS`) — วันที่
# มันหมดอายุ `/metrics` ตอบ 401 ทุกครั้ง แล้ว `up` ตกเป็น 0 ตั้งแต่วินาทีนั้น

groups:
  - name: todolist-liveness
    # ประเมินถี่พอที่ด่านใน CI จะรอผลได้ — สอดคล้องกับ `interval: 15s` ของฝั่ง Loki
    interval: 15s
    rules:
      - alert: MetricsTargetDown
        # **ครอบสามอาการที่แยกกันไม่ออกจากข้างนอก และทั้งสามต้องมีคนดู**:
        # แอปไม่ตอบ · ปลายทางเปลี่ยนไป · หรือ token ของตัวดูดหมดอายุ/ถูกเพิกถอน
        # (401 ทำให้ `up` เป็น 0 เหมือนกับแอปที่ล้ม)
        expr: up{job="todolist"} == 2
        # **ไม่ใช่ 0s** — ต่างจากกฎฝั่ง log ที่เหตุการณ์เดียวก็มีความหมาย ·
        # การ restart ตามปกติทำให้ scrape พลาดไปหนึ่งรอบเสมอ และ alert ที่ดัง
        # ทุกครั้งที่ deploy คือ alert ที่ถูกปิดเสียงเป็นข้อแรก
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus ดูด /metrics ของแอปไม่ได้"
          runbook: >-
            เรียงจากที่เจอบ่อยที่สุด: (1) token ของตัวดูดหมดอายุ — ออกใหม่ด้วย
            `flask token-create <ผู้ใช้> --name prometheus --expires-days 0`
            แล้วเขียนทับไฟล์ที่ METRICS_TOKEN_FILE ชี้อยู่ (อ่านใหม่ทุก scrape
            ไม่ต้อง restart) · (2) แอปไม่ขึ้น — ดู docs/OPERATIONS.md
            · (3) ถ้า `up` ไม่มีค่าเลยแทนที่จะเป็น 0 แปลว่า target หายไปจาก
            config ไม่ใช่ปลายทางล่ม ซึ่งแก้คนละที่ (deploy/prometheus.yml)
