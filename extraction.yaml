# สำมะโนการถอดแกน governance ไป repo `verifiable-gates` — ADR 0075 ข้อ 6 · ขั้น 0
#
# **ไฟล์นี้เป็นคำตัดสิน ไม่ใช่สถานะ** — ทุกไฟล์ในขอบเขต (scripts/ · overlays/ · skill/ ·
# docs/comparison/ · ไฟล์ governance ที่ราก · เทสต์ที่เอ่ยถึงของพวกนั้น) ต้องถูกตัดสิน
# หนึ่งในสาม: `move` (ไปทั้งไฟล์) · `stay` (อยู่ทั้งไฟล์) · `split` (บางส่วนไป — บอกว่าอะไร
# ไปอะไรอยู่) · `tests/test_extraction_manifest.py` บังคับ partition สองทิศ: ไฟล์ที่ไม่ถูก
# ตัดสิน = แดง · รายการที่ชี้ไฟล์ผี = แดง (รูปเดียวกับ DATA-CLASSIFICATION และ gates.yaml)
#
# `stage` = ขั้นที่ย้ายตามแผน (2 แกน overlay · 3 ตัวตรวจ governance · 4 ตัวตรวจ supply chain
# · 5 เครื่องมือวิจัย) · เมื่อขั้นนั้นเสร็จ รายการ move ของขั้นนั้นต้องหายไปจากไฟล์นี้
# พร้อมไฟล์ (ไฟล์นี้หดลงเรื่อย ๆ จนเหลือแต่ stay/split แล้วถูกถอดในขั้น 6)
#
# วัดจริง 2026-08-25: scripts 33 ตัว import กันเอง 2 คู่ · CI เรียก scripts 14 จุด ·
# overlay ส่งออก 14 ไฟล์ · เทสต์ที่เอ่ยถึง scripts/overlays/skill 29 ไฟล์

