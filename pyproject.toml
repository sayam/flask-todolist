# config กลางของเครื่องมือคุณภาพทั้งหมด (Phase 0 — ดู docs/STANDARDS.md)
# หลักการ: เปิดทุกกฎแล้วปิดรายข้อพร้อมเหตุผล — ของที่ปิดต้อง justify ตัวเอง

[tool.pytest.ini_options]
pythonpath = ["."]
# `--strict-markers`: พิมพ์ชื่อ marker ผิดต้องแดงทันที ไม่ใช่กลายเป็น marker ใหม่
# ที่ไม่มีใครกรองด้วย (job `bare` จะรันเทสต์ที่ตั้งใจให้ข้ามโดยไม่มีใครรู้)
addopts = "--strict-markers"
markers = [
  # จุด plug ประกาศไลบรารีของตัวเองไว้ใน manifest และมันอยู่นอก `[packages]`
  # ของ core (ADR 0025) — เทสต์ที่ต้องใช้ไลบรารีพวกนั้นจึงต้องบอกตัวเองว่า
  # "ฉันไม่ใช่ของ core" job `bare` ใน CI รันด้วย `-m "not plugin_deps"`
  # เพื่อพิสูจน์ว่าที่เหลือทั้งชุดเขียวได้โดยไม่มีไลบรารีของ plugin ตัวไหนเลย
  "plugin_deps: ต้องติดตั้งไลบรารีที่ manifest ของจุด plug ประกาศไว้ก่อนถึงจะรันได้",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
# migrations ไม่ lint: โค้ดกึ่ง generate + raw SQL เก่าที่จะถูกล้างตอน Phase 5 squash
# (กติกา dialect ของ migration คุมด้วย tests/test_migration_lint.py แทน)
# skill/ ไม่ lint: แพ็กเกจ generate ล้วน (ADR 0050) — สำเนา checker ถูก lint
# ที่ต้นทาง overlays/flask/ แล้ว และ tests/test_agent_skill.py เทียบไบต์ต่อไบต์
extend-exclude = ["migrations", "app/sun_data.py", "skill"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # -- ผูกกับแผนเฟส --
    "ANN",     # type annotation: เปิดพร้อม mypy strict แบบไล่ต่อ module (Phase 2)
    # -- ขัดกับธรรมเนียมของโปรเจกต์ (มีเหตุผลบันทึกไว้) --
    "D",       # pydocstyle: docstring เป็นภาษาไทย กติกา punctuation อังกฤษใช้ไม่ได้
               # ปริมาณ docstring คุมด้วย interrogate แทน
    "DTZ",     # naive-UTC เป็นดีไซน์ที่ตั้งใจและบันทึกใน CLAUDE.md (tz.py แปลงให้)
    "RUF001", "RUF002", "RUF003",  # ข้อความไทยใช้ em-dash/curly quotes โดยตั้งใจ
    "PLC0415", # import ใน function = ท่ามาตรฐานกัน circular import ของ Flask factory
    "A003",    # model attribute ชื่อ id เป็นธรรมเนียม ORM
    "RUF012",  # Flask config-class pattern ใช้ class attribute เป็น dict ตรง ๆ
    "FBT001", "FBT002",  # boolean positional: click flags / SQLAlchemy default
    # -- ความเห็นด้าน style ที่เลือกไม่ตาม --
    "EM101", "EM102", "TRY003",  # ข้อความใน raise เขียน inline อ่านง่ายกว่าแยกตัวแปร
    "TRY300",  # return ใน try อ่านตรงไปตรงมากว่า else
    # -- ชนกับ ruff format (ตามคำแนะนำ official) --
    "COM812", "ISC001",
    "CPY001",  # ไม่ใช้ copyright header ต่อไฟล์ — license ประกาศระดับ repo

]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "INP001",   # tests ไม่ใช่ package (pytest หาเจอผ่าน pythonpath)
    "S101",     # assert คือหัวใจของ pytest
    "S105", "S106",  # รหัสผ่าน dummy ในเทสต์ ไม่ใช่ secret จริง
    "PLR2004",  # ตัวเลขดิบในเทสต์คือ expected value อ่านตรง ๆ ดีกว่าตั้งชื่อ
    "ARG001",   # fixture ที่ inject เพื่อ side effect (เช่น user_id) แต่ไม่ได้ใช้ค่า
    "SLF001",   # เทสต์แตะฟังก์ชันภายในได้ — นโยบายอย่าง _column_change/_hmac ต้องพิสูจน์
                # ทีละชั้น การทดสอบผ่านทางอ้อมอย่างเดียวไม่ได้บอกว่าชั้นไหนพัง
]
"scripts/generate_sun_table.py" = ["C901"]  # main() เป็นไปป์ไลน์เส้นตรงของขั้นตอน
    # generate ที่อ่านไล่บนลงล่างได้ การหั่นให้ผ่าน gate ทำให้ตามลำดับยากกว่าเดิม
"scripts/**" = ["T201", "INP001", "PLR2004", "S101"]  # สคริปต์รันมือ: print คือ output,
"overlays/flask/preflight.py" = ["RUF100"]  # สำเนาที่ส่งมอบต้องตรงกับ
    # `scripts/preflight.py` **ไบต์ต่อไบต์** (ADR 0063 — tests/test_overlay.py บังคับ)
    # ต้นทางอยู่ใต้ `scripts/**` ซึ่งเปิดกฎ S จึงต้องมี `# noqa: S603` ส่วนที่นี่ปิด S
    # ไว้ทั้งหมด noqa ตัวเดียวกันเลยกลายเป็น "ไม่ได้ใช้" — ลบออกไม่ได้เพราะจะ drift
"overlays/**" = ["T201", "INP001", "S603", "PLR2004"]  # เครื่องมือที่ส่งมอบ:
    # stdlib ล้วน รันเดี่ยว print คือรายงาน · subprocess เรียก checker ของตัวเองด้วย path คงที่
    # ไม่ใช่ package, ตัวเลขในสูตรดาราศาสตร์อ่านคู่กับสูตรตรง ๆ, assert เป็น sanity check
"app/plugins/*/*/*.py" = ["INP001"]  # ไฟล์ของ plugin ถูกโหลดตาม path ไม่ใช่ตามชื่อ
    # โมดูล (ดู `load_module()`) จึงไม่ต้องเป็น package — ใส่ __init__.py กลับเข้าไป
    # แปลว่าไอดีของ plugin ต้องเป็นชื่อโมดูล python ที่ถูกต้อง ซึ่งไม่ใช่สัญญาที่ตั้งไว้
"tests/**/*" = ["INP001"]
"migrations/**" = ["INP001"]

[tool.ruff.lint.mccabe]
max-complexity = 10  # ลดจาก 12 ได้หลัง Phase 3 ย้าย branch ของตัวกรองออกจาก routes (ratchet)

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
# โหมด gradual: ทั้งแอปตรวจแบบหลวม + module ที่ประกาศแล้วต้อง strict
# ขยาย strict list ลงล่างเรื่อย ๆ จนครบ (เป้าหมาย: ทั้งแอปภายใน Phase 2)
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
# **ส่วนเสริมของ plugin อยู่นอกสายตาของ mypy** — ไม่ใช่การยกเว้นเพื่อความสะดวก
# แต่เพราะ mypy ตั้งชื่อโมดูลให้มันไม่ได้: ไอดีของจุด plug คือชื่อไดเรกทอรี ซึ่ง
# **มีขีดกลางได้โดยตั้งใจ** (plugin ถูกโหลดตาม path ไม่ใช่ตามชื่อโมดูล — ดู
# `load_module()` และ per-file-ignores ของ ruff ข้างบน) พอมีขีดกลาง mypy หยุด
# ไล่ package ตรงนั้นแล้วเรียกไฟล์ว่าโมดูล `provide` เฉย ๆ ผลคือสองอย่าง:
#   (ก) ไม่ตรงกับ override `app.plugins.*` ข้างล่าง ไลบรารีของส่วนเสริมจึงกลายเป็น
#       error ทั้งที่ ADR 0025 ตั้งใจให้ job นี้ไม่ต้องติดตั้งมัน
#   (ข) **ส่วนเสริมตัวที่สองทำให้ mypy ล้มทั้ง job** ด้วย duplicate module เพราะ
#       ทุกตัวใช้ชื่อไฟล์ `provide.py` ตามสัญญาเดียวกัน (ยืนยันด้วยการวางตัวที่สอง
#       ลงไปจริงแล้ว: "errors prevented further checking")
# ทางแก้ที่ mypy เสนอ ข้อ (b) ใส่ `__init__.py` ขัดกับสัญญาที่ว่าไอดีของ plugin
# ไม่ต้องเป็นชื่อโมดูล python ที่ถูกต้อง ข้อ (c) explicit-package-bases ก็ยังติด
# ขีดกลางอยู่ดี — เหลือข้อ (a) ซึ่งคือบรรทัดนี้
# **ราคาที่จ่าย:** `provide.py` ไม่ถูก type check เลย รับได้เพราะโดยนิยามมันคือ
# ไฟล์ที่ import ไลบรารีซึ่งไม่มีอยู่ในสภาพแวดล้อมของ core (mypy จึงทำอะไรได้ไม่มาก
# อยู่แล้ว) และสัญญาของมันถูกบังคับด้วย host ตอนรัน + เทสต์สแกน import ของ Phase 4.5
exclude = ["app/plugins/.*/enhancements/"]

[[tool.mypy.overrides]]
module = [
    "flask_login.*", "flask_limiter.*", "flask_wtf.*",
    "flask_babel.*", "flask_migrate.*", "flask_sqlalchemy.*",
    "flask_talisman.*",
    "flask_smorest.*",  # marshmallow/apispec/webargs มี py.typed แต่ตัว smorest ยังไม่มี
]
ignore_missing_imports = true

# `db.Model` ของ flask_sqlalchemy เป็น attribute แบบ dynamic mypy จึงมองไม่เห็น
# ตัวคลาส — ปิดเฉพาะ error ตัวนี้ตัวเดียว ส่วนที่เหลือของไฟล์ยัง strict เต็ม
# (โค้ดแอปเลิกใช้ `Model.query` แบบเก่าแล้วตั้งแต่ Phase 3 — query ทุกจุดเป็น
# `select()` ของ SQLAlchemy 2.0 แต่ base class ยังต้องเป็น `db.Model` อยู่ดี
# เพราะ flask-sqlalchemy ผูก metadata/session ผ่านตัวนั้น)
[[tool.mypy.overrides]]
module = ["app.models", "app.audit"]
disable_error_code = ["name-defined"]

# โค้ดของ plugin import ไลบรารีที่ **ไม่ได้อยู่ในสภาพแวดล้อมของ core** ได้
# (ADR 0025 — ไลบรารีของ plugin อยู่ใน category แยก `pipenv sync --dev` ไม่ติดตั้งให้)
# ถ้าไม่ปิดข้อนี้ job `lint` จะบังคับให้ต้องติดตั้งไลบรารีของ plugin ทุกตัวก่อน
# type check ได้ ซึ่งเท่ากับยกเลิกการแยก dependency ที่เพิ่งทำไปทั้งหมด
#
# **ราคาที่จ่าย:** ชื่อโมดูลที่พิมพ์ผิดในโค้ด plugin จะไม่ถูก mypy จับ — รับได้
# เพราะเส้นทางนั้นถูกเทสต์จริงเรียกอยู่แล้ว และมีเทสต์สแกน import เทียบกับ
# manifest อีกชั้น (Phase 4.5 step ถัดไป)
[[tool.mypy.overrides]]
module = ["app.plugins.*"]
disable_error_code = ["import-not-found", "import-untyped"]

# strict list — module ที่ pure (ไม่พึ่ง extension ที่ไม่มี type stub)
[[tool.mypy.overrides]]
module = [
    "app.tz", "app.filters", "app.plugins", "app.sun_data",
    "app.models", "app.soft_delete", "app.purge", "app.audit",
    "app.i18n", "app.theme",
    "app.services.*",
    "app.api.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
warn_return_any = true
strict_equality = true

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/sun_data.py"]  # ตาราง generate — ไม่มี logic ให้ cover

[tool.coverage.report]
show_missing = true
# ตั้งจากค่าที่วัดจริงตอน Phase 0 แล้วห้ามต่ำลง (ratchet ขึ้นได้อย่างเดียว)
fail_under = 96  # วัดจริง 2026-08-12 (Phase 7 จบ): 96.31% — ขยับขึ้นได้อย่างเดียว
# **ตอนปิดเฟสวัดได้ 96.18% ซึ่งลดจาก 96.58% ของ Phase 6** — ไล่ดูแล้วพบว่า
# กิ่งที่ขาดคือ *พฤติกรรมที่เฟสนี้อ้างเองว่าสำคัญ* (แถวล็อกของสาย audit หายไป
# ต้องดัง · plugin ตัวเดียวพังต้องไม่ล้มทั้งคำขอ) — อ้างแล้วไม่เทสต์คือช่องว่าง
# แบบเดียวกับที่เฟสนี้ไล่ปิดมาตลอด จึงเขียนเทสต์ให้แล้วขึ้นมาที่ 96.31%
# **ยังไม่ขยับเพดาน** เพราะที่ว่างเหลือ 0.31 จุด ซึ่งต่ำกว่านโยบาย ~1 จุด
# **ไม่ขยับเป็น 96.5** เพราะเลขที่ชิดค่าที่วัดได้ทำให้การเพิ่มโค้ดที่ถูกต้อง
# แต่ยังไม่มีเทสต์ (เช่นเส้นทาง error ของ backend ตัวใหม่) กลายเป็นงานที่ต้อง
# หยุดทำ ratchet มีไว้กันการถอยหลัง ไม่ใช่กันการเดินหน้า
# (คงที่ 96 ไม่ใช่ลืมขยับ — เฟสนี้เพิ่มโค้ดของ registry/CLI ที่มีกิ่งของ
#  "ไม่มีไลบรารี/ไม่ได้ถูกเลือก" ซึ่งเดินได้เฉพาะบางสภาพแวดล้อม เพดานจึงยังไม่ขยับ)

# ---------------------------------------------------------------- interrogate
[tool.interrogate]
# **ไม่มีคีย์ `paths` ที่นี่** — interrogate รับ path จาก command line เท่านั้น
# ใส่ไว้ก็ถูกเมิน (เคยใส่แล้วเข้าใจผิดว่าจำกัดขอบเขตให้แล้ว) ขอบเขตจริงคือ
# `interrogate app` ใน .github/workflows/ci.yml — รันเปล่า ๆ จะกวาดทั้ง repo
exclude = ["app/sun_data.py"]
ignore-init-method = true
ignore-nested-functions = true
# ตั้งจากค่าที่วัดจริงตอน Phase 0 (ratchet เช่นกัน)
fail-under = 84  # วัดจริง 2026-08-12 (Phase 7 จบ): 84.9% — ขยับขึ้นได้อย่างเดียว
# **Phase 6 กินที่ว่างไปแล้วคืนเอง**: `app/metrics.py` ที่เพิ่มเข้ามาทำให้ตกไป
# ที่ 84.3% (เหลือที่ว่างแค่ 0.3 จุด) จึงเขียน docstring ของโมดูลนั้นให้ครบ
# แล้วกลับมาที่ 84.7% — **เฟสที่กินที่ว่างคือเฟสที่ต้องคืน** ไม่ใช่ปล่อยให้
# เฟสถัดไปเจอ CI แดงตอนที่กำลังแก้เรื่องอื่นอยู่
# **ตั้งต่ำกว่าค่าที่วัดได้ ~1 จุด โดยตั้งใจ** เพดานที่ชนค่าที่วัดได้พอดี (80 กับ
# 80.3) ทำให้ฟังก์ชันใหม่ที่ไม่มี docstring แค่สองตัวก็ทำ CI แดง ซึ่งจะแดงตอนที่
# คนกำลังแก้เรื่องอื่นอยู่ — ที่ว่างตรงนี้คือที่ให้งานปกติเดินได้ ไม่ใช่ที่ให้
# ปล่อยผ่าน ถ้าถูกกินจนหมดแปลว่าถึงเวลาเขียน docstring ชุดถัดไปแล้วขยับเพดานตาม
